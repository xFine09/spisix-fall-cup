<style>
/* Diseño: el lenguaje de osu! (hit circles con número de combo, approach circle, slider) en colores de otoño.
   Lo llamativo está en un solo sitio: el playfield del hero. El resto, sobrio: líneas finas, subrayados y poco color.
   Contraste: los colores cumplen 4.5:1 sobre sus fondos suaves en los dos temas. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E4E8EF; --ink:#141827; --muted:#555C72; --line:#D6DBE5; --field:#7C8398;
  --accent:#B23F0E; --accent-soft:#FBE4D8; --accent-ink:#FFFFFF;
  --lower:#1D6B86; --lower-soft:#DBEDF3;
  --good:#1A7540; --live:#BC2E22; --warn:#875709;
  --m-nm:#4A5170; --m-hd:#875709; --m-hr:#BF2F25; --m-dt:#7140B8; --m-fm:#1D6B86; --m-tb:#171A26; --slot-ink:#FFFFFF;
  --pf:#161A29; --pf-2:#1F2437; --pf-ink:#EEF0F6; --pf-muted:#AEB4C8; --pf-line:#30364C;
  --av-s:58%; --av-l:86%; --av-fg:28%;
  --shadow:0 1px 2px rgba(20,24,39,.05);
  --f-display:'M PLUS Rounded 1c','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Atkinson Hyperlegible Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121C; --surface:#171B28; --surface-2:#212637; --ink:#ECEEF5; --muted:#9BA2B7; --line:#2A3043; --field:#6E7690;
  --accent:#FF8A4C; --accent-soft:#3A2217; --accent-ink:#1C0B03;
  --lower:#5CC2DF; --lower-soft:#13303A;
  --good:#4FC57F; --live:#FF6B5B; --warn:#E8B04E;
  --m-nm:#A9B0D0; --m-hd:#E8B04E; --m-hr:#FF7A6B; --m-dt:#B78CFF; --m-fm:#5CC2DF; --m-tb:#ECEEF4; --slot-ink:#0F121C;
  --pf:#0A0D16; --pf-2:#151A28; --pf-line:#272D40;
  --av-s:40%; --av-l:30%; --av-fg:86%;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121C; --surface:#171B28; --surface-2:#212637; --ink:#ECEEF5; --muted:#9BA2B7; --line:#2A3043; --field:#6E7690;
  --accent:#FF8A4C; --accent-soft:#3A2217; --accent-ink:#1C0B03;
  --lower:#5CC2DF; --lower-soft:#13303A;
  --good:#4FC57F; --live:#FF6B5B; --warn:#E8B04E;
  --m-nm:#A9B0D0; --m-hd:#E8B04E; --m-hr:#FF7A6B; --m-dt:#B78CFF; --m-fm:#5CC2DF; --m-tb:#ECEEF4; --slot-ink:#0F121C;
  --pf:#0A0D16; --pf-2:#151A28; --pf-line:#272D40;
  --av-s:40%; --av-l:30%; --av-fg:86%;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
a.pl{color:inherit;text-decoration:none}
a.pl:hover,a.pl:focus-visible{color:var(--accent);text-decoration:underline}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:clamp(1.55rem,3.4vw,2.15rem);font-weight:900}
h3{font-size:1.12rem;font-weight:800}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
/* La cabecera fija no tapa lo que recibe el foco ni los anclajes */
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
#app:focus,[data-focus-target]:focus{outline:none}
a,button,select,label,summary{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.88rem;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:1.08rem;white-space:nowrap;flex:none}
.logo{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:.85rem;font-family:var(--f-display);font-weight:900}
/* Las secciones que no caben pasan al menú «Más» (fitNav); la actual siempre queda a la vista. */
nav.main{display:flex;gap:2px;flex:1;min-width:0;align-self:stretch}
nav.main>a[hidden],.more[hidden]{display:none}
.more{position:relative;display:flex;flex:none}
.more-btn{display:flex;align-items:center;gap:5px;padding:0 11px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.94rem;cursor:pointer;white-space:nowrap}
.more-btn svg{width:12px;height:12px;transition:transform .15s}
.more-btn[aria-expanded="true"]{color:var(--ink)}
.more-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.more-btn:focus-visible{outline-offset:-3px}
/* Única sombra grande de la web: el desplegable flota sobre el contenido. */
.more-menu{position:absolute;top:100%;right:0;z-index:30;display:grid;min-width:190px;padding:6px;margin-top:1px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -14px rgba(10,13,22,.35)}
.more-menu[hidden]{display:none}
nav.main .more-menu a{display:flex;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;white-space:nowrap}
nav.main .more-menu a:hover{background:var(--surface-2)}
nav.main .more-menu a[aria-current]{color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
nav.main .more-menu a[aria-current]::after{content:none}
.more.solo{flex:0 1 auto;min-width:0}
.more.solo .more-btn{min-width:0;color:var(--ink)}
.more.solo .more-btn span{overflow:hidden;text-overflow:ellipsis}
.more.solo .more-btn{position:relative}
.more.solo .more-btn::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.more.solo .more-menu{left:0;right:auto}
@media (max-width:700px){.more-menu{left:0;right:auto}}
nav.main a{position:relative;display:flex;align-items:center;padding:0 11px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.94rem;white-space:nowrap}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink)}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
nav.main a:focus-visible{outline-offset:-3px}
.who{flex:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.who a.login{background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}
.who button{font:inherit;font-size:.84rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.theme{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.theme:hover{color:var(--ink);border-color:var(--muted)}
.theme svg{width:18px;height:18px}
@media (max-width:700px){.brand .full,.who .uname{display:none}}

main{padding-block:32px 120px;display:grid;gap:40px}
section{display:grid;gap:18px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}

/* Hero: un playfield de osu! (oscuro en los dos temas) con un slider que acaba en el hit circle de la cuenta atrás */
.hero{--ink:var(--pf-ink);--muted:var(--pf-muted);--line:var(--pf-line);--surface:var(--pf-2);--surface-2:var(--pf-line);
  position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;
  padding:clamp(28px,5vw,60px);border-radius:28px;background:var(--pf);color:var(--ink)}
@media (max-width:820px){.hero{grid-template-columns:1fr;border-radius:22px}}
.hero .slider{position:absolute;left:50%;top:50%;width:560px;height:440px;overflow:visible;z-index:0;pointer-events:none}
.hero .slider path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hero .slider .edge{stroke:var(--pf-ink);stroke-width:62px;opacity:.9}
.hero .slider .body{stroke:color-mix(in srgb,var(--accent) 38%,var(--pf));stroke-width:52px}
@media (max-width:820px){.hero .slider{display:none}}
/* El único momento de entrada: el slider se dibuja de izquierda a derecha hasta el hit circle */
@media (prefers-reduced-motion:no-preference){.hero .slider.enter{animation:draw 1.1s cubic-bezier(.3,0,.2,1) .15s both}}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hero h1{font-size:clamp(2.6rem,7.6vw,5rem);font-weight:900;letter-spacing:-.02em;line-height:1.02}
.hero .lead{font-size:1.08rem;color:var(--muted);max-width:52ch}
.hero-copy{display:grid;gap:20px;justify-items:start}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none}
.fact{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600}
.fact::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:filter .15s,background-color .15s,border-color .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-danger{background:var(--surface);color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,var(--line))}
.btn-sm{padding:6px 12px;font-size:.84rem}
.btn:hover{filter:brightness(1.07)}
.btn:active{filter:brightness(.95)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
/* El resto de controles responde igual: se marca al pasar el ratón y baja 1 px al pulsar. */
.who button:hover,.checks label:hover,.more-btn:hover{color:var(--ink);border-color:var(--muted)}
.who a.login:hover,.top .pill.live:hover,.lv-x:hover{filter:brightness(1.12)}
.btn:active,.who button:active,.who a.login:active,.theme:active,.checks label:active,.rm:active,.rpool button:not(:disabled):active,.tab:active,.lv-x:active,.top .pill.live:active,.qs-x:active,.more-btn:active{transform:translateY(1px)}

.next{display:grid;justify-items:center;gap:14px;text-align:center}
.hc-stage{position:relative;padding:26px}
.next>:not(.hc-stage){position:relative;z-index:1}
.next .num{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.hc{position:relative;z-index:1;width:min(220px,58vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 55%,#fff) 0%,var(--accent) 64%);border:10px solid var(--pf-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--pf-ink) 30%,transparent),0 18px 46px -18px var(--accent);display:grid;place-items:center;color:#fff}
/* Approach circle: al entrar en Inicio cierra tres veces sobre el hit circle (unos 5 s) y se queda quieto, sin bucle. */
.hc::before{content:"";position:absolute;inset:-18px;border:3px solid var(--accent);border-radius:50%;transform:scale(1.2);opacity:.45;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.hc-stage.enter .hc::before{animation:approach 1.6s cubic-bezier(.45,0,1,1) 3,settle .5s ease-out 4.8s forwards}}
@keyframes approach{0%{transform:scale(1.75);opacity:0}25%{opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes settle{from{transform:scale(1.2);opacity:0}to{transform:scale(1.2);opacity:.45}}
.cd{font-family:var(--f-display);font-weight:900;font-size:clamp(1.5rem,5vw,2.05rem);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.cd small{display:block;font-size:.74rem;margin-top:8px;font-family:var(--f-body);font-weight:600;opacity:.95;text-shadow:none}
.vs{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:1.05rem}
.vs i{font-style:normal;color:var(--muted);font-size:.85rem;font-weight:600}

/* Avatares y pills */
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;background:hsl(var(--h,220) var(--av-s) var(--av-l));color:hsl(var(--h,220) 55% var(--av-fg));font-weight:800;font-size:.72rem;font-family:var(--f-display);object-fit:cover}
.av.lg{width:46px;height:46px;font-size:.9rem}
.av.xl{width:64px;height:64px;font-size:1.1rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
/* El punto solo marca estados reales (en juego, terminado, conectado); las etiquetas como «Upper bracket» o «Warmup» no lo llevan.
   En directo parpadea cuatro veces al aparecer y se queda fijo. */
.pill.live::before,.pill.done::before,.pill.good::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{color:var(--live);background:color-mix(in srgb,var(--live) 14%,var(--surface))}
.pill.live::before{animation:blink 1.2s 4}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.pill.done,.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.pill.tbd{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--surface))}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.low{color:var(--lower);background:var(--lower-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.list{display:grid;gap:10px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Partidos */
.mt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.mt.live{border-color:color-mix(in srgb,var(--live) 55%,var(--line));box-shadow:inset 4px 0 0 var(--live)}
.mt-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.mt-top time{font-variant-numeric:tabular-nums;font-size:.86rem;font-weight:600}
.mt-p{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.side{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.side.r{flex-direction:row-reverse;text-align:right}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sd{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none}
.side.lose{color:var(--muted);font-weight:500}
.side.tbd .nm{color:var(--muted);font-style:italic;font-weight:500}
.sc{font-family:var(--f-display);font-weight:900;font-size:1.45rem;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sc i{font-style:normal;color:var(--muted);font-weight:500}
.sc .vsx{font-size:.8rem;color:var(--muted);font-weight:600}
.mt-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.mt-meta code{color:var(--ink);overflow-wrap:anywhere}
.picks{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.picks .lbl{font-size:.8rem;color:var(--muted);font-weight:700;margin-right:2px}
.picks .lbl+.lbl,.picks .slot+.lbl{margin-left:8px}
.slot{--mc:var(--m-nm);display:inline-block;font-family:var(--f-mono);font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,var(--surface));border-bottom:3px solid transparent}
.slot.HD{--mc:var(--m-hd)}.slot.HR{--mc:var(--m-hr)}.slot.DT{--mc:var(--m-dt)}.slot.FM{--mc:var(--m-fm)}.slot.TB{--mc:var(--m-tb)}
.slot.wa{border-bottom-color:var(--accent)}.slot.wb{border-bottom-color:var(--lower)}
.slot.ban{text-decoration:line-through 2px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mc) 40%,transparent)}
@media (max-width:520px){.side .av{display:none}.sc{font-size:1.2rem}}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.tab{position:relative;flex:none;padding:10px 12px;border:0;border-radius:6px 6px 0 0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;cursor:pointer;font-family:inherit}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline-offset:-3px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}

/* Calendario: las fases son una secuencia, así que van numeradas como el combo de un slider */
.tl{overflow-x:auto;padding:4px 2px 8px}
.tl ol{list-style:none;margin:0;padding:0;display:flex;min-width:max-content;counter-reset:combo}
.tl li{position:relative;padding:44px 22px 0 0;min-width:140px;display:grid;gap:2px;align-content:start;counter-increment:combo}
.tl li::before{content:"";position:absolute;top:13px;left:0;right:0;height:8px;border-radius:8px;background:var(--surface-2)}
.tl li:last-child::before{right:auto;width:34px}
.tl li.past::before,.tl li.now::before{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.tl li::after{content:counter(combo);position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:.95rem;background:var(--surface);color:var(--muted);border:3px solid var(--line)}
.tl li.past::after{background:var(--accent);border-color:var(--surface);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
.tl li.now::after{background:var(--accent);border-color:var(--surface);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent),0 0 0 7px var(--accent-soft)}
.tl b{font-size:.98rem}
.tl span{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl li.now b{color:var(--accent)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.82rem;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td .who2{display:flex;align-items:center;gap:9px;font-weight:600}
tr.cut td{border-bottom:2px dashed var(--accent)}

/* Jugadores */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center}
.pc .av{grid-row:span 2}
.pc b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .sub{font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}
.pc .pill{grid-column:1/-1;justify-self:start;margin-top:8px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Tarjeta de inscrito: toda la tarjeta abre la ficha (el enlace del nombre se estira por encima) */
.pc{position:relative}
.pc a.pl-card{color:inherit;text-decoration:none}
.pc a.pl-card::after{content:"";position:absolute;inset:0;border-radius:14px}
.pc:has(a.pl-card:hover){border-color:var(--accent)}
.pc:has(a.pl-card:hover) a.pl-card{color:var(--accent)}
.pc:has(a.pl-card:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pc a.pl-card:focus-visible{outline:none}
/* Ficha del jugador */
.back{display:inline-block;margin-bottom:10px;font-size:.9rem;font-weight:600}
.fi-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.fi-id{display:grid;gap:4px;min-width:0}
.fi-id h2{margin:0;overflow-wrap:anywhere}
.fi-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted);font-size:.9rem}
.fi-kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.fi-kpis .kpi{padding:12px 14px}
.fi-kpis .kpi b{font-size:1.45rem;overflow-wrap:anywhere}
.rk{margin:18px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rk figcaption{display:grid;gap:2px;margin-bottom:30px;font-size:.9rem} /* hueco para el rótulo al pasar el ratón */
.rk-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.rk-y{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:right}
.rk-plot{position:relative;height:130px;touch-action:pan-y;cursor:crosshair}
.rk-plot svg{display:block;width:100%;height:100%;overflow:visible}
.rk-g{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 4}
.rk-line{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.rk-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface);transform:translate(-50%,-50%);pointer-events:none}
.rk-cur{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);pointer-events:none}
.rk-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--surface);font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.rk-x{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.fi-at{font-size:.82rem;margin:12px 0 0}
.fi-btns{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:520px){.fi-head .av.xl{width:56px;height:56px}.rk-plot{height:110px}}
/* Skills y rendimiento por mod en la ficha */
.sk,.md{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sk h3,.md h3{margin:0 0 4px;font-size:1rem}
.sk-note,.md-note{font-size:.82rem;margin:0 0 12px}
.md-note{margin:10px 0 0}
.sk-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sk-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:.88rem;margin-bottom:5px}
.sk-top b .muted{font-weight:500;font-size:.8rem}
.sk-top>span{font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:520px){.sk-top{flex-direction:column}}
.sk .tr{display:block;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.sk .tr i{display:block;height:100%;min-width:4px;background:var(--accent);border-radius:99px}
.sk-ch{font-weight:700;margin-left:6px;white-space:nowrap}
.sk-ch.up{color:var(--good)}
.sk-ch.down{color:var(--live)}
.md table td small{color:var(--muted)}
/* o!TR en la ficha */
.ot{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ot h3{margin:0 0 4px;font-size:1rem}
.ot-note{font-size:.82rem;margin:0 0 12px}
.ot .kpi{background:var(--surface-2);border-color:transparent}
/* Partidos de un jugador */
.pj-tools{margin-bottom:12px}
.pj-tools select{flex:0 1 280px}
.pj-who{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:4px 0 14px}
.pj-n{font-family:var(--f-display);font-weight:800;font-size:1.15rem;min-width:0;overflow-wrap:anywhere}
.side.me .nm{font-weight:800;text-decoration:underline 2px var(--accent);text-underline-offset:4px}
/* Los campos llevan un borde más marcado (--field, 3:1 como mínimo) que tarjetas y separadores, para que se vea dónde escribir. */
input[type=search],input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--field);border-radius:10px;padding:9px 12px;min-width:0;max-width:100%}
input[type=search]{flex:1 1 220px}
textarea{width:100%;min-height:120px;resize:vertical;font-family:var(--f-mono);font-size:.8rem}
.imp{font-size:.85rem;display:grid;gap:4px}

.imp b{font-weight:600}

/* Mappool */
.maps{display:grid;gap:8px}
.map{display:grid;grid-template-columns:64px 96px minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.map .slot{font-size:.9rem;padding:8px 0;text-align:center;width:64px;background:var(--mc);color:var(--slot-ink);border:0;border-radius:0;clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%)}
.map .cover{width:96px;aspect-ratio:3/2;border-radius:8px;background:var(--surface-2) center/cover no-repeat;max-width:100%}
.map .t{min-width:0}
.map .t a,.map .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--ink);text-decoration:none}
.map .t a:hover{text-decoration:underline}
.map .t span{font-size:.82rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map .st{display:flex;gap:14px;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.map .st b{color:var(--ink)}
.maps.nocover .map{grid-template-columns:64px minmax(0,1fr) auto auto}
/* ID para copiar y abrir en osu! */
.ma{display:flex;gap:6px;align-items:center}
.ma-id,.ma-direct{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .8rem/1 var(--f-mono);font-variant-numeric:tabular-nums;text-decoration:none;cursor:pointer;white-space:nowrap}
.ma-direct{font-family:inherit}
.ma-id svg{width:14px;height:14px;flex:none;color:var(--muted)}
.ma-id:hover,.ma-direct:hover{border-color:var(--muted)}
.ma-id:active,.ma-direct:active{transform:translateY(1px)}
.ma-id.ok{border-color:var(--good);color:var(--good)}
.ma-id.ok svg{color:currentColor}
.maps.nocover .cover{display:none}
@media (max-width:700px){.map,.maps.nocover .map{grid-template-columns:52px minmax(0,1fr)}.map .slot{width:52px}.map .cover{display:none}.map .st{grid-column:1/-1;flex-wrap:wrap;gap:6px 12px}.map .ma{grid-column:1/-1}}
@media (max-width:1100px) and (min-width:701px){.map{grid-template-columns:64px 96px minmax(0,1fr) auto}.maps.nocover .map{grid-template-columns:64px minmax(0,1fr) auto}.map .ma{grid-column:-2/-1;justify-content:flex-end}}

/* Cuadro */
.bracket{overflow-x:auto;padding-bottom:10px}
.bcols{display:flex;gap:22px;min-width:max-content;align-items:stretch}
.bcol{display:flex;flex-direction:column;width:200px}
.bcol h4{margin:0 0 10px;font-family:var(--f-display);font-size:.92rem;font-weight:800;color:var(--muted)}
.bcol .stack{display:flex;flex-direction:column;justify-content:space-around;gap:12px;flex:1}
.bm{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.86rem}
.bm.live{border-color:var(--live)}
.bm-row{display:grid;grid-template-columns:22px minmax(0,1fr) 22px;gap:6px;align-items:center;padding:6px 9px}
.bm-row+.bm-row{border-top:1px solid var(--line)}
.bm-row .s{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.bm-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bm-row .v{font-family:var(--f-display);font-weight:900;text-align:right}
.bm-row.w{background:var(--accent-soft)}
.lowerb .bm-row.w{background:var(--lower-soft)}
.bm-row.l .n,.bm-row.l .v{color:var(--muted);font-weight:500}
.bm-row.t .n{color:var(--muted);font-style:italic;font-weight:500}
.bm-f{font-size:.7rem;color:var(--muted);padding:3px 9px;background:var(--surface-2);font-family:var(--f-mono);display:flex;justify-content:space-between;gap:6px}

/* Stats */
.st-page{display:grid;gap:14px}
a.tab{text-decoration:none}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.st-views{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.st-views .eyebrow{margin-right:4px}
.st-view{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem}
.st-view:hover{border-color:var(--muted)}
.st-view[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* overflow:clip recorta las esquinas sin crear zona de desplazamiento: así la cabecera de la tabla se queda fija al bajar */
.st-tbl{overflow:hidden;overflow:clip}
.st-tbl th{position:sticky;top:var(--top-h,0px);z-index:1}
.st-tbl tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.st-tbl tr.pod{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.st-tbl tr.pod .st-pos{color:var(--accent);font-weight:800;box-shadow:inset 3px 0 0 var(--accent)}
.st-tbl .st-pl{font-weight:600}
.st-tbl .st-val{font-weight:800}
.st-best{display:grid;gap:1px;line-height:1.35}
.st-best>span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st-best>span:nth-child(2){color:var(--muted);font-family:var(--f-mono);font-size:.84rem}
.st-plus{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--muted)}
.st-ez{margin-left:6px;font-size:.72rem;font-weight:700;color:var(--warn);font-family:var(--f-body)}
.st-page .slot{border-bottom:0}
.st-rk{display:inline-grid;vertical-align:middle;place-items:center;min-width:1.7em;padding:0 4px;border-radius:5px;font-family:var(--f-display);font-weight:900;font-size:.8rem;line-height:1.5;color:var(--muted);background:var(--surface-2)}
.st-rk-SS,.st-rk-S{color:var(--warn)}.st-rk-A{color:var(--good)}.st-rk-B{color:var(--lower)}.st-rk-C{color:var(--m-dt)}.st-rk-D,.st-rk-F{color:var(--live)}
.st-help{font-size:.88rem;color:var(--muted);max-width:75ch}
.st-help summary{cursor:pointer;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.st-help p{margin:8px 0 0}
.st-q{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:900;font-size:.85rem}
.st-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.st-maps{display:grid;gap:10px}
.st-map{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.st-map>summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
.st-map>summary::-webkit-details-marker{display:none}
.st-map>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.st-map[open]>summary::before{transform:rotate(45deg)}
.st-map>summary:focus-visible{outline-offset:-3px}
.st-mt{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-map .st-lb{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.st-none{margin:0;padding:0 14px 14px}
/* En el móvil, cada fila es una tarjeta: la posición a la izquierda y cada dato con su nombre encima */
@media (max-width:640px){
  .st-tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .st-tbl table,.st-tbl tbody{display:block}
  .st-tbl tr{display:grid;grid-template-columns:2rem repeat(2,minmax(0,1fr));gap:6px 14px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line)}
  .st-tbl tr:last-child{border-bottom:0}
  .st-tbl td{display:block;padding:0;border:0;white-space:normal;text-align:left}
  .st-tbl td.n{text-align:left}
  .st-tbl td[data-l]::before{content:attr(data-l);display:block;font-family:var(--f-body);font-size:.74rem;font-weight:700;color:var(--muted)}
  .st-tbl td.st-pos{grid-row:1/span 4;text-align:center;font-weight:800}
  .st-tbl td.st-pos::before{display:none}
  .st-tbl td.st-pl,.st-tbl td.st-bc{grid-column:2/-1}
  .st-tbl tr.pod .st-pos{box-shadow:none}
  .st-tbl tr.pod{box-shadow:inset 3px 0 0 var(--accent)}
  .st-mt{white-space:normal}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.9rem;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--muted)}

/* Info */
.prose{display:grid;gap:12px;max-width:72ch;align-content:start}
.prose ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start}
.step .k{font-family:var(--f-display);font-size:.9rem;color:var(--accent);font-weight:900}

.qr-list{display:grid;gap:0;padding-block:4px}
.qr{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qr:first-child{border-top:0}
.qr.mine .qr-id b{color:var(--accent)}
.qr-id{display:grid}
.qr-m{font-size:.82rem}
@media (max-width:760px){.qr{grid-template-columns:60px minmax(0,1fr)}.qr-m,.qr>.qs-r{grid-column:2}}
.news{display:grid;gap:4px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 10px 10px 0}
.news p{margin:0;overflow-wrap:anywhere}
.rem{display:grid;gap:6px}
.rem ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rem a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;text-decoration:none}
.rem a:hover{border-color:var(--accent)}
.rem .k{flex:none;min-width:58px;font-size:.75rem;font-weight:700;color:var(--accent)}
.rem .tx{min-width:0;overflow-wrap:anywhere}
.qd{display:grid;gap:8px}
.qd h3{margin:0;text-transform:capitalize}
.qx{display:grid;gap:10px}
.qx+.qx{border-top:1px solid var(--line);margin-top:6px;padding-top:16px}
.qs-n.pend{border-style:dashed;opacity:.8}
.qs-n small{font-size:.72rem;font-weight:500;color:var(--muted)}
.qs-x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;font-size:1rem;line-height:1;min-width:24px;min-height:24px;display:inline-grid;place-items:center;border-radius:50%;margin:-4px -6px -4px -2px}
.qs-x:hover{color:var(--ink);background:var(--surface-2)}
/* Con el dedo: controles de al menos 44 px de alto */
@media (pointer:coarse){
  .btn,.btn-sm,.tab,.who button,.who a.login,.checks label,.rm{min-height:44px}
  .theme{width:44px;height:44px}
  .qs-x{min-width:36px;min-height:36px}
  input[type=text],input[type=search],input[type=password],input[type=number],input[type=datetime-local],input[type=date],select{min-height:44px}
  /* Zona táctil de 44 px sin cambiar el aspecto: el logo, los enlaces sueltos (pie, «Todos», MP, títulos de mapa) y el menú «Más». */
  .brand{min-height:44px;min-width:44px;justify-content:center}
  .foot a,.sec-head>a,a.mp-link{padding:12px 4px;margin:-12px -4px}
  input[type=file]{min-height:44px}
  .map .t a{padding-block:11px;margin-block:-11px}
  .ma-id,.ma-direct{min-height:44px}
  nav.main .more-menu a{min-height:44px}
}
.qs-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Corregir un lobby a mano (árbitros) */
.qfix{grid-column:1/-1;display:grid;gap:12px;padding:14px;border-radius:10px;background:var(--surface-2);margin-top:4px}
.qfix .field{max-width:320px}
.qf-p{display:grid;gap:6px}
.qf-h{font-size:.78rem;font-weight:700;color:var(--muted)}
.qf-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qf-n{font-weight:600;min-width:8ch}
.qs-p{display:flex;flex-wrap:wrap;gap:6px}
.qs-n{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.qs-n.me{border-color:var(--accent);font-weight:600}

/* Formularios */
form.f{display:grid;gap:14px;max-width:560px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row .field{flex:1 1 140px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:.88rem;cursor:pointer}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.9rem}

<script>
'use strict';
/* =====================================================================
   SpiSix: Fall Cup, web pública.
   Pide /api/state al servidor. Si no hay servidor (vista previa), usa datos de ejemplo.
   La configuración real está en config.json; esta copia solo se usa en la vista previa.
   ===================================================================== */
const DEFAULT_CONFIG = {
  nombre:'SpiSix: Fall Cup', sigla:'SPI', comunidad:'SpiSix', zona:'Europe/Madrid',
  rango:{min:100000,max:999999,excepciones:[]}, paises:null, clasificados:16, metodoClasif:'zsum',
  multiplicadores:{EZ:1.8,EZHD:2.0},
  fases:[
    {key:'registros',nombre:'Registros',inicio:'2026-10-28',fin:'2026-11-07'},
    {key:'qualifiers',nombre:'Clasificatorios',showcase:'2026-11-08',inicio:'2026-11-09',fin:'2026-11-15',sr:5.4},
    {key:'octavos',nombre:'Octavos',showcase:'2026-11-16',inicio:'2026-11-17',fin:'2026-11-22',sr:5.2,bo:9},
    {key:'cuartos',nombre:'Cuartos',showcase:'2026-11-23',inicio:'2026-11-24',fin:'2026-11-29',sr:5.4,bo:9},
    {key:'semis',nombre:'Semifinales',showcase:'2026-11-30',inicio:'2026-12-01',fin:'2026-12-06',sr:5.6,bo:11},
    {key:'finals',nombre:'Finals',showcase:'2026-12-07',inicio:'2026-12-07',fin:'2026-12-13',sr:5.8,bo:11},
    {key:'gf',nombre:'Grand Finals',showcase:'2026-12-14',inicio:'2026-12-15',fin:'2026-12-20',sr:6.1,bo:13}
  ],
  twitch:'spi6_osu',
  enlaces:[['Discord de SpiSix','https://discord.gg/H3gGw9CGRx'],['Twitch','https://www.twitch.tv/spi6_osu']],
  staff:[]
};

/* ---------------- utilidades ---------------- */
const DAY=864e5, HOUR=36e5, MIN=6e4;
const MODS=['NM','HD','HR','DT','FM','TB'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('es-ES');
const dec=(x,d=1)=>Number(x).toFixed(d).replace('.',',');
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=hashStr(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function tzOffset(ms,tz){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(ms);const g=t=>+p.find(x=>x.type===t).value;return Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))-ms}
function zoned(str,end,tz){const [d,t]=String(str).split('T');const [Y,M,D]=d.split('-').map(Number);const [h,mi,s]=t?t.split(':').map(Number):end?[23,59,59]:[0,0,0];const g=Date.UTC(Y,M-1,D,h,mi||0,s||0);return g-tzOffset(g,tz)}
function toLocalInput(ms,tz){if(!ms) return '';const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(ms);const g=t=>p.find(x=>x.type===t).value;return `${g('year')}-${g('month')}-${g('day')}T${g('hour')}:${g('minute')}`}
function initials(n){const c=String(n).replace(/[^A-Za-z0-9]/g,'');return (c.slice(0,2)||'??').toUpperCase()}
function sortSlots(a,b){return MODS.indexOf(a.slot.slice(0,2))-MODS.indexOf(b.slot.slice(0,2))||(parseInt(a.slot.slice(2))||0)-(parseInt(b.slot.slice(2))||0)}
let F={}; // formateadores de fecha según la zona del torneo
function makeFmt(tz){F={
  dia:new Intl.DateTimeFormat('es-ES',{timeZone:tz,weekday:'short',day:'numeric',month:'short'}),
  corto:new Intl.DateTimeFormat('es-ES',{timeZone:tz,day:'numeric',month:'short'}),
  hora:new Intl.DateTimeFormat('es-ES',{timeZone:tz,hour:'2-digit',minute:'2-digit'})}}
const dia=t=>F.dia.format(t), hora=t=>F.hora.format(t), corto=t=>F.corto.format(t);
const rangoFechas=(a,b)=>corto(a)===corto(b)?corto(a):corto(a)+' – '+corto(b);

/* ---------------- estructura del cuadro: doble eliminación de 16 ---------------- */
const BRACKET=(()=>{
  const so=[1,16,8,9,5,12,4,13,3,14,6,11,7,10,2,15], L=[];
  const add=(id,fase,ronda,lado,col,a,b)=>L.push({id,fase,ronda,lado,col,srcA:a,srcB:b});
  for(let i=1;i<=8;i++) add('u1-'+i,'octavos','Upper · Octavos','W',0,{q:so[2*i-2]},{q:so[2*i-1]});
  for(let i=1;i<=4;i++) add('u2-'+i,'cuartos','Upper · Cuartos','W',1,{m:'u1-'+(2*i-1),r:'W'},{m:'u1-'+(2*i),r:'W'});
  for(let i=1;i<=4;i++) add('l1-'+i,'cuartos','Lower · Ronda 1','L',0,{m:'u1-'+(2*i-1),r:'L'},{m:'u1-'+(2*i),r:'L'});
  for(let i=1;i<=2;i++) add('u3-'+i,'semis','Upper · Semifinal','W',2,{m:'u2-'+(2*i-1),r:'W'},{m:'u2-'+(2*i),r:'W'});
  for(let i=1;i<=4;i++) add('l2-'+i,'semis','Lower · Ronda 2','L',1,{m:'l1-'+i,r:'W'},{m:'u2-'+(5-i),r:'L'});
  for(let i=1;i<=2;i++) add('l3-'+i,'semis','Lower · Ronda 3','L',2,{m:'l2-'+(2*i-1),r:'W'},{m:'l2-'+(2*i),r:'W'});
  add('u4-1','finals','Upper · Final','W',3,{m:'u3-1',r:'W'},{m:'u3-2',r:'W'});
  for(let i=1;i<=2;i++) add('l4-'+i,'finals','Lower · Ronda 4','L',3,{m:'l3-'+i,r:'W'},{m:'u3-'+(3-i),r:'L'});
  add('l5-1','finals','Lower · Semifinal','L',4,{m:'l4-1',r:'W'},{m:'l4-2',r:'W'});
  add('l6-1','gf','Lower · Final','L',5,{m:'l5-1',r:'W'},{m:'u4-1',r:'L'});
  add('gf','gf','Grand Final','GF',0,{m:'u4-1',r:'W'},{m:'l6-1',r:'W'});
  return L;
})();

/* ---------------- cálculo del torneo a partir del estado ---------------- */
let S=null, T=null, DEMO=false, LOADED=Date.now();
const nowMs=()=>DEMO?S.now:S.now+(Date.now()-LOADED);

function computeQual(players){
  const pool=(S.pools.qualifiers||[]);
  const bids=pool.map(m=>String(m.beatmap_id));
  const rows=[];
  for(const [uid,maps] of Object.entries(S.qual.scores||{})){
    const p=players.get(+uid); if(!p) continue; // solo inscritos
    rows.push({player:p,scores:bids.map(b=>maps[b]||0)});
  }
  rows.forEach(r=>{r.total=r.scores.reduce((a,b)=>a+b,0);r.z=0});
  bids.forEach((_,j)=>{const v=rows.map(r=>r.scores[j]);const mean=v.reduce((a,b)=>a+b,0)/(v.length||1);const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(v.length||1))||1;rows.forEach(r=>r.z+=(r.scores[j]-mean)/sd)});
  const byZ=S.config.metodoClasif!=='suma';
  rows.sort((a,b)=>byZ?b.z-a.z:b.total-a.total);
  rows.forEach((r,i)=>{r.seed=i+1});
  return {pool,rows};
}

// server/bracket.js repite este cálculo (seeds y cruces) para el bot de arbitraje: si cambias uno, cambia el otro.
function compute(){
  const C=S.config, NOW=nowMs();
  makeFmt(C.zona);
  const phases=C.fases.map(f=>({...f,start:zoned(f.inicio,false,C.zona),end:zoned(f.fin,true,C.zona),sc:f.showcase?zoned(f.showcase,false,C.zona):null}));
  phases.forEach(p=>p.estado=NOW>p.end?'past':NOW>=p.start?'now':'future');
  const cur=phases.find(p=>p.estado==='now')||phases.find(p=>p.estado==='future')||phases[phases.length-1];
  const phaseBy=Object.fromEntries(phases.map(p=>[p.key,p]));
  const players=new Map(S.players.map(p=>[p.id,{...p}]));
  const qual=computeQual(players);
  qual.rows.forEach(r=>r.player.qseed=r.seed);
  const seedsFinal=NOW>phaseBy.qualifiers.end&&qual.rows.length>=C.clasificados;

  const matches=BRACKET.map(b=>({...b})), byId={};
  matches.forEach(m=>byId[m.id]=m);
  const src=s=>{
    if(s.q) return seedsFinal?qual.rows[s.q-1].player:null;
    const m=byId[s.m]; if(!m||m.estado!=='done') return null;
    return s.r==='W'?m.winner:m.loser;
  };
  const perPhase={};
  matches.forEach(m=>{(perPhase[m.fase]=perPhase[m.fase]||[]).push(m)});
  matches.forEach(m=>{
    m.a=src(m.srcA); m.b=src(m.srcB);
    const p=phaseBy[m.fase]; m.bo=p.bo||9; m.need=(m.bo+1)/2;
    if(S.demo) demoFill(m,p,perPhase[m.fase].indexOf(m),perPhase[m.fase].length,NOW);
    const rec=S.matches[m.id]||{};
    Object.assign(m,{time:rec.time||null,ref:rec.ref||null,mp:rec.mp||null,ff:rec.ff||null,bans:rec.bans||[],protects:rec.protects||[],by:rec.by||null,result:rec.result||null});
    m.sa=m.a&&m.result?(m.result.wins?.[m.a.id]||0):0;
    m.sb=m.b&&m.result?(m.result.wins?.[m.b.id]||0):0;
    if(!m.a||!m.b) m.estado='tbd';
    else if(m.ff){m.estado='done';m.winner=m.ff==='a'?m.a:m.b;m.loser=m.ff==='a'?m.b:m.a}
    else if(m.sa>=m.need||m.sb>=m.need){m.estado='done';m.winner=m.sa>m.sb?m.a:m.b;m.loser=m.sa>m.sb?m.b:m.a}
    else if(m.time&&NOW>=m.time&&(m.mp||m.sa+m.sb>0)) m.estado='live';
    else if(m.time) m.estado='sched';
    else m.estado='unset';
  });

  // estado de cada jugador
  const status=new Map();
  players.forEach(p=>status.set(p.id,{k:'reg',txt:'Inscrito'}));
  qual.rows.forEach(r=>status.set(r.player.id,seedsFinal?(r.seed<=C.clasificados?{k:'in',txt:'Seed '+r.seed}:{k:'out',txt:'No clasificado'}):{k:'reg',txt:'Clasificatorios jugados'}));
  matches.filter(m=>m.estado!=='tbd'&&m.lado==='L').forEach(m=>[m.a,m.b].forEach(p=>{if(status.get(p.id).k==='in') status.set(p.id,{k:'lower',txt:'En lower bracket'})}));
  matches.filter(m=>m.estado==='done').forEach(m=>{
    if(m.lado!=='W') status.set(m.loser.id,{k:'out',txt:'Eliminado · '+m.ronda.replace(' · ',' ')});
    if(m.id==='gf') status.set(m.winner.id,{k:'champ',txt:'Campeón'});
  });
  return {C,NOW,phases,phaseBy,cur,players,qual,seedsFinal,matches,byId,status};
}

function demoFill(m,p,k,n,NOW){
  if(S.matches[m.id]) return;
  const days=Math.max(1,Math.round((p.end-p.start)/DAY));
  const t=p.start+Math.floor(k*days/n)*DAY+(18+(k%3)*1.5)*HOUR;
  const rec={time:t,ref:pick(rng(m.id),['Gofio','Kestrel','Marlín','Nerea_ref']),mp:null,ff:null,bans:[],result:null};
  S.matches[m.id]=rec;
  if(!m.a||!m.b||NOW<t) return;
  const r=rng('res'+m.id), sa=DEMO_SKILL.get(m.a.id)||1, sb=DEMO_SKILL.get(m.b.id)||1, pA=sa**4/(sa**4+sb**4);
  const need=((p.bo||9)+1)/2, pool=(S.pools[m.fase]||[]).filter(x=>x.slot!=='TB');
  const used=new Set(), take=()=>{const av=pool.filter(x=>!used.has(x.slot));if(!av.length) return null;const x=pick(r,av);used.add(x.slot);return x};
  for(let i=0;i<4;i++){const x=take();if(x) rec.bans.push(x.slot)}
  const maps=[], wins={[m.a.id]:0,[m.b.id]:0};
  while(wins[m.a.id]<need&&wins[m.b.id]<need){
    const tb=wins[m.a.id]===need-1&&wins[m.b.id]===need-1;
    const x=tb?(S.pools[m.fase]||[]).find(y=>y.slot==='TB'):take(); if(!x) break;
    const w=r()<pA?m.a.id:m.b.id; wins[w]++; maps.push({bid:x.beatmap_id,slot:x.slot,w,scores:{}});
  }
  const live=NOW<t+95*MIN;
  const shown=live?maps.slice(0,Math.max(1,Math.floor(maps.length*(NOW-t)/(95*MIN)))):maps;
  const w2={[m.a.id]:0,[m.b.id]:0}; shown.forEach(x=>w2[x.w]++);
  rec.mp=127000000+(hashStr(m.id)%900000);
  rec.result={wins:w2,maps:shown,updated:NOW};
}

// Dirección de la página: #stats/<ronda>?view=<vista>. Sin vista (o con una desconocida), resultados individuales.
function statsRoute(hash){
  const VIEWS=['resultados-individuales','leaderboard-por-mapa'];
  const [path,qs='']=String(hash||'').replace(/^#/,'').split('?');
  const parts=path.split('/');
  let round=null;try{round=parts[1]?decodeURIComponent(parts[1]):null}catch(_){}
  const view=new URLSearchParams(qs).get('view');
  return {round,view:VIEWS.includes(view)?view:VIEWS[0]};

// Números en español con el punto de miles siempre: en es-ES, Intl no agrupa los de 4 cifras (1234 → «1234»)
// salvo con useGrouping 'always', que los navegadores antiguos no conocen; por eso se repasa la parte entera.
const grp=s=>{const [i,d]=s.split(',');return i.replace(/\./g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d!=null?','+d:'')};
const NF_INT=new Intl.NumberFormat('es-ES',{useGrouping:'always',maximumFractionDigits:0});
const NF_3=new Intl.NumberFormat('es-ES',{useGrouping:'always',minimumFractionDigits:3,maximumFractionDigits:3});
const NF_2=new Intl.NumberFormat('es-ES',{useGrouping:'always',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=n=>n==null?'–':grp(NF_INT.format(Math.round(n)));
const fmt3=n=>n==null?'–':grp(NF_3.format(n));
const fmtAcc=a=>a==null?'–':grp(NF_2.format(a*100))+' %'; // la API da la precisión de 0 a 1
/* /stats:puros */
const STATS_VIEWS={'resultados-individuales':'Resultados individuales','leaderboard-por-mapa':'Leaderboard por mapa'};
// Respuestas de /api/stats por ronda y vista. Se piden otra vez cada vez que se recarga el estado (cada minuto),
// así un partido en juego se actualiza con la sincronización. Mientras llega la nueva, se ve la anterior.
const STATS={};
function statsData(round,view){
  if(DEMO) return null;
  const k=round+'|'+view, c=STATS[k];
  if(!c||(c.at!==LOADED&&!c.loading)) fetchStats(k,round,view);
  return STATS[k];
}
async function fetchStats(k,round,view){
  const c=STATS[k]||(STATS[k]={}), at=LOADED;
  c.loading=true;
  try{
    const r=await fetch(`/api/stats?round=${encodeURIComponent(round)}&view=${encodeURIComponent(view)}`,{credentials:'same-origin',headers:{Accept:'application/json'}});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j) throw new Error(j?.error||'');
    c.data=j;c.err=null;
  }catch(e){c.err=e.message||'No se han podido cargar las estadísticas. Se volverá a intentar en un minuto.'}
  c.at=at;c.loading=false;
  if(currentView()!=='stats') return;
  const s=statsRoute(location.hash);
  if(STATS_SHOWN===k||(s.round===round&&s.view===view)) renderKeepFocus();
}

// Recordatorios de Inicio: salen solos de los datos del torneo y desaparecen cuando dejan de ser actuales.
function reminders(){
  const {NOW,matches,phases}=T;
  const when=t=>{const d=dia(t);return `${d===dia(NOW)?'Hoy':d===dia(NOW+DAY)?'Mañana':d} a las ${hora(t)}`};
  const name=p=>`<b>${esc(p.username)}</b>`;
  const row=(k,href,html)=>`<li><a href="${href}"><span class="k">${k}</span><span class="tx">${html}</span></a></li>`;
  const next=matches.filter(m=>m.estado==='sched'&&m.time>NOW&&m.time-NOW<=DAY).sort((a,b)=>a.time-b.time).slice(0,5)
    .map(m=>row('Partido','#partidos',`${when(m.time)}: ${name(m.a)} vs ${name(m.b)} · ${esc(m.ronda)}`));
  const pools=phases.flatMap(p=>{
    const r=S.releases?.[p.key];
    if(!r) return [];
    if(r.at<=NOW&&NOW-r.at<=3*DAY&&(S.pools[p.key]||[]).length) return [row('Mappool','#mappool',`Ya está publicada la mappool de ${esc(p.nombre)}.`)];
    if(r.set&&r.at>NOW&&r.at-NOW<=3*DAY) return [row('Mappool','#mappool',`${when(r.at)} se publica la mappool de ${esc(p.nombre)}.`)];
    return [];
  });
  const results=matches.filter(m=>m.estado==='done'&&m.time&&m.time<=NOW&&NOW-m.time<=DAY).sort((a,b)=>b.time-a.time).slice(0,5)
    .map(m=>row('Resultado','#partidos',m.ff?`${name(m.winner)} gana por forfeit a ${name(m.loser)} · ${esc(m.ronda)}`:`${name(m.a)} ${m.sa} – ${m.sb} ${name(m.b)} · ${esc(m.ronda)}`));
  const qr=S.qual.results, quals=qr==null?[]:qr<=NOW?(NOW-qr<=3*DAY?[row('Clasificatorios','#jugadores',`Ya están publicados los resultados de los clasificatorios.`)]:[])
    :qr-NOW<=3*DAY?[row('Clasificatorios','#jugadores',`${when(qr)} se publican los resultados de los clasificatorios.`)]:[];
  const items=[...next,...pools,...quals,...results];
  return items.length?`<section class="rem" aria-label="Recordatorios"><span class="eyebrow">Recordatorios</span><ul>${items.join('')}</ul></section>`:'';
}

// matchCard se usa con .map(matchCard), que pasa el índice como segundo argumento: por eso hay dos funciones.
const matchCard=m=>matchCardOf(m,null);
// me: ID del jugador cuyos partidos se están viendo. Se resalta su lado y se dice si ganó o perdió.
function matchCardOf(m,me){
  const side=(p,s,right,mine,other)=>{
    const cls=!p?'tbd':(m.estado==='done'&&m.loser===p?'lose':'')+(me&&p.id===me?' me':'');
    return `<div class="side ${right?'r':''} ${cls}">${av(p)}<span class="nm">${p?pname(p):esc(srcLabel(s))}</span>${p&&p.qseed?`<span class="sd">#${p.qseed}</span>`:''}</div>`;
  };
  const hasScore=(m.estado==='done'||m.estado==='live')&&!m.ff;
  const maps=m.result?.maps||[];

// Rango de los últimos 90 días: una línea (arriba, mejor rango). Los días sin rango (null) dejan un hueco.
function rankChart(hist){
  const pts=hist.map((v,i)=>({i,v})).filter(x=>x.v);
  if(pts.length<2) return '<p class="muted" style="font-size:.85rem">Sin historial de rango: osu! lo guarda solo mientras el jugador tiene rango.</p>';
  const n=hist.length, vs=pts.map(x=>x.v), best=Math.min(...vs), worst=Math.max(...vs), span=worst-best||1;
  const X=i=>n>1?i/(n-1)*100:0, Y=v=>4+(v-best)/span*92; // en % del ancho y del alto
  let d='',prev=-2;
  pts.forEach(({i,v})=>{d+=`${i===prev+1?'L':'M'}${X(i).toFixed(2)} ${Y(v).toFixed(2)}`;prev=i});
  const first=pts[0], last=pts[pts.length-1], diff=first.v-last.v, ago=n-1-first.i;
  const trend=diff>0?`ha subido ${nf.format(diff)} puestos`:diff<0?`ha bajado ${nf.format(-diff)} puestos`:'sigue en el mismo puesto';
  const sum=`Hace ${ago} días: #${nf.format(first.v)}. Ahora: #${nf.format(last.v)}; ${trend}.`;
  return `<figure class="rk"><figcaption><b>Rango en los últimos 90 días</b><span class="muted">${esc(sum)}</span></figcaption>
    <div class="rk-box"><div class="rk-y" aria-hidden="true"><span>#${nf.format(best)}</span><span>#${nf.format(worst)}</span></div>
    <div class="rk-plot" data-h="${esc(JSON.stringify(hist))}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="${esc(sum)}"><line class="rk-g" x1="0" x2="100" y1="4" y2="4"/><line class="rk-g" x1="0" x2="100" y1="96" y2="96"/><path class="rk-line" d="${d}"/></svg>
    <span class="rk-dot" style="left:${X(last.i)}%;top:${Y(last.v)}%"></span><span class="rk-cur" hidden></span><span class="rk-tip" hidden></span></div>
    <span></span><div class="rk-x" aria-hidden="true"><span>hace ${n-1} días</span><span>hoy</span></div></div></figure>`;
}
