<style>
/* Diseño: el lenguaje de osu! (hit circles con número de combo, approach circle, slider) en colores de otoño.
   Lo llamativo está en un solo sitio: el playfield del hero. El resto, sobrio: líneas finas, subrayados y poco color.
   Contraste: los colores cumplen 4.5:1 sobre sus fondos suaves en los dos temas. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E4E8EF; --ink:#141827; --muted:#555C72; --line:#D6DBE5; --field:#7C8398;
  --accent:#B23F0E; --accent-soft:#FBE4D8; --accent-ink:#FFFFFF;
  --lower:#1D6B86; --lower-soft:#DBEDF3;
  --good:#1A7540; --live:#BC2E22; --warn:#875709;
  --m-nm:#4A5170; --m-hd:#875709; --m-hr:#BF2F25; --m-dt:#7140B8; --m-fm:#1D6B86; --m-tb:#171A26; --slot-ink:#FFFFFF;
  --pf:#161A29; --pf-2:#1F2437; --pf-ink:#EEF0F6; --pf-muted:#AEB4C8; --pf-line:#30364C;
  --av-s:58%; --av-l:86%; --av-fg:28%;
  --shadow:0 1px 2px rgba(20,24,39,.05);
  --f-display:'M PLUS Rounded 1c','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Atkinson Hyperlegible Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121C; --surface:#171B28; --surface-2:#212637; --ink:#ECEEF5; --muted:#9BA2B7; --line:#2A3043; --field:#6E7690;
  --accent:#FF8A4C; --accent-soft:#3A2217; --accent-ink:#1C0B03;
  --lower:#5CC2DF; --lower-soft:#13303A;
  --good:#4FC57F; --live:#FF6B5B; --warn:#E8B04E;
  --m-nm:#A9B0D0; --m-hd:#E8B04E; --m-hr:#FF7A6B; --m-dt:#B78CFF; --m-fm:#5CC2DF; --m-tb:#ECEEF4; --slot-ink:#0F121C;
  --pf:#0A0D16; --pf-2:#151A28; --pf-line:#272D40;
  --av-s:40%; --av-l:30%; --av-fg:86%;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121C; --surface:#171B28; --surface-2:#212637; --ink:#ECEEF5; --muted:#9BA2B7; --line:#2A3043; --field:#6E7690;
  --accent:#FF8A4C; --accent-soft:#3A2217; --accent-ink:#1C0B03;
  --lower:#5CC2DF; --lower-soft:#13303A;
  --good:#4FC57F; --live:#FF6B5B; --warn:#E8B04E;
  --m-nm:#A9B0D0; --m-hd:#E8B04E; --m-hr:#FF7A6B; --m-dt:#B78CFF; --m-fm:#5CC2DF; --m-tb:#ECEEF4; --slot-ink:#0F121C;
  --pf:#0A0D16; --pf-2:#151A28; --pf-line:#272D40;
  --av-s:40%; --av-l:30%; --av-fg:86%;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:clamp(1.55rem,3.4vw,2.15rem);font-weight:900}
h3{font-size:1.12rem;font-weight:800}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
/* La cabecera fija no tapa lo que recibe el foco ni los anclajes */
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
#app:focus,[data-focus-target]:focus{outline:none}
a,button,select,label,summary{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.88rem;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:1.08rem;white-space:nowrap;flex:none}
.logo{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:.85rem;font-family:var(--f-display);font-weight:900}
/* Las secciones que no caben pasan al menú «Más» (fitNav); la actual siempre queda a la vista. */
nav.main{display:flex;gap:2px;flex:1;min-width:0;align-self:stretch}
nav.main>a[hidden],.more[hidden]{display:none}
.more{position:relative;display:flex;flex:none}
.more-btn{display:flex;align-items:center;gap:5px;padding:0 11px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.94rem;cursor:pointer;white-space:nowrap}
.more-btn svg{width:12px;height:12px;transition:transform .15s}
.more-btn[aria-expanded="true"]{color:var(--ink)}
.more-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.more-btn:focus-visible{outline-offset:-3px}
/* Única sombra grande de la web: el desplegable flota sobre el contenido. */
.more-menu{position:absolute;top:100%;right:0;z-index:30;display:grid;min-width:190px;padding:6px;margin-top:1px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -14px rgba(10,13,22,.35)}
.more-menu[hidden]{display:none}
nav.main .more-menu a{display:flex;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;white-space:nowrap}
nav.main .more-menu a:hover{background:var(--surface-2)}
nav.main .more-menu a[aria-current]{color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
nav.main .more-menu a[aria-current]::after{content:none}
.more.solo{flex:0 1 auto;min-width:0}
.more.solo .more-btn{min-width:0;color:var(--ink)}
.more.solo .more-btn span{overflow:hidden;text-overflow:ellipsis}
.more.solo .more-btn{position:relative}
.more.solo .more-btn::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.more.solo .more-menu{left:0;right:auto}
@media (max-width:700px){.more-menu{left:0;right:auto}}
nav.main a{position:relative;display:flex;align-items:center;padding:0 11px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.94rem;white-space:nowrap}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink)}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
nav.main a:focus-visible{outline-offset:-3px}
.who{flex:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.who a.login{background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}
.who button{font:inherit;font-size:.84rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.theme{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.theme:hover{color:var(--ink);border-color:var(--muted)}
.theme svg{width:18px;height:18px}
@media (max-width:700px){.brand .full,.who .uname{display:none}}

main{padding-block:32px 120px;display:grid;gap:40px}
section{display:grid;gap:18px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}

/* Hero: un playfield de osu! (oscuro en los dos temas) con un slider que acaba en el hit circle de la cuenta atrás */
.hero{--ink:var(--pf-ink);--muted:var(--pf-muted);--line:var(--pf-line);--surface:var(--pf-2);--surface-2:var(--pf-line);
  position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;
  padding:clamp(28px,5vw,60px);border-radius:28px;background:var(--pf);color:var(--ink)}
@media (max-width:820px){.hero{grid-template-columns:1fr;border-radius:22px}}
.hero .slider{position:absolute;left:50%;top:50%;width:560px;height:440px;overflow:visible;z-index:0;pointer-events:none}
.hero .slider path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hero .slider .edge{stroke:var(--pf-ink);stroke-width:62px;opacity:.9}
.hero .slider .body{stroke:color-mix(in srgb,var(--accent) 38%,var(--pf));stroke-width:52px}
@media (max-width:820px){.hero .slider{display:none}}
/* El único momento de entrada: el slider se dibuja de izquierda a derecha hasta el hit circle */
@media (prefers-reduced-motion:no-preference){.hero .slider.enter{animation:draw 1.1s cubic-bezier(.3,0,.2,1) .15s both}}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hero h1{font-size:clamp(2.6rem,7.6vw,5rem);font-weight:900;letter-spacing:-.02em;line-height:1.02}
.hero .lead{font-size:1.08rem;color:var(--muted);max-width:52ch}
.hero-copy{display:grid;gap:20px;justify-items:start}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none}
.fact{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600}
.fact::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:filter .15s,background-color .15s,border-color .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-danger{background:var(--surface);color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,var(--line))}
.btn-sm{padding:6px 12px;font-size:.84rem}
.btn:hover{filter:brightness(1.07)}
.btn:active{filter:brightness(.95)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
/* El resto de controles responde igual: se marca al pasar el ratón y baja 1 px al pulsar. */
.who button:hover,.checks label:hover,.more-btn:hover{color:var(--ink);border-color:var(--muted)}
.who a.login:hover,.top .pill.live:hover,.lv-x:hover{filter:brightness(1.12)}
.btn:active,.who button:active,.who a.login:active,.theme:active,.checks label:active,.rm:active,.rpool button:not(:disabled):active,.tab:active,.lv-x:active,.top .pill.live:active,.qs-x:active,.more-btn:active{transform:translateY(1px)}

.next{display:grid;justify-items:center;gap:14px;text-align:center}
.hc-stage{position:relative;padding:26px}
.next>:not(.hc-stage){position:relative;z-index:1}
.next .num{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.hc{position:relative;z-index:1;width:min(220px,58vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 55%,#fff) 0%,var(--accent) 64%);border:10px solid var(--pf-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--pf-ink) 30%,transparent),0 18px 46px -18px var(--accent);display:grid;place-items:center;color:#fff}
/* Approach circle: al entrar en Inicio cierra tres veces sobre el hit circle (unos 5 s) y se queda quieto, sin bucle. */
.hc::before{content:"";position:absolute;inset:-18px;border:3px solid var(--accent);border-radius:50%;transform:scale(1.2);opacity:.45;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.hc-stage.enter .hc::before{animation:approach 1.6s cubic-bezier(.45,0,1,1) 3,settle .5s ease-out 4.8s forwards}}
@keyframes approach{0%{transform:scale(1.75);opacity:0}25%{opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes settle{from{transform:scale(1.2);opacity:0}to{transform:scale(1.2);opacity:.45}}
.cd{font-family:var(--f-display);font-weight:900;font-size:clamp(1.5rem,5vw,2.05rem);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.cd small{display:block;font-size:.74rem;margin-top:8px;font-family:var(--f-body);font-weight:600;opacity:.95;text-shadow:none}
.vs{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:1.05rem}
.vs i{font-style:normal;color:var(--muted);font-size:.85rem;font-weight:600}

/* Avatares y pills */
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;background:hsl(var(--h,220) var(--av-s) var(--av-l));color:hsl(var(--h,220) 55% var(--av-fg));font-weight:800;font-size:.72rem;font-family:var(--f-display);object-fit:cover}
.av.lg{width:46px;height:46px;font-size:.9rem}
.av.xl{width:64px;height:64px;font-size:1.1rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
/* El punto solo marca estados reales (en juego, terminado, conectado); las etiquetas como «Upper bracket» o «Warmup» no lo llevan.
   En directo parpadea cuatro veces al aparecer y se queda fijo. */
.pill.live::before,.pill.done::before,.pill.good::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{color:var(--live);background:color-mix(in srgb,var(--live) 14%,var(--surface))}
.pill.live::before{animation:blink 1.2s 4}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.pill.done,.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.pill.tbd{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--surface))}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.low{color:var(--lower);background:var(--lower-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.list{display:grid;gap:10px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Partidos */
.mt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.mt.live{border-color:color-mix(in srgb,var(--live) 55%,var(--line));box-shadow:inset 4px 0 0 var(--live)}
.mt-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.mt-top time{font-variant-numeric:tabular-nums;font-size:.86rem;font-weight:600}
.mt-p{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.side{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.side.r{flex-direction:row-reverse;text-align:right}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sd{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none}
.side.lose{color:var(--muted);font-weight:500}
.side.tbd .nm{color:var(--muted);font-style:italic;font-weight:500}
.sc{font-family:var(--f-display);font-weight:900;font-size:1.45rem;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sc i{font-style:normal;color:var(--muted);font-weight:500}
.sc .vsx{font-size:.8rem;color:var(--muted);font-weight:600}
.mt-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.mt-meta code{color:var(--ink);overflow-wrap:anywhere}
.picks{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.picks .lbl{font-size:.8rem;color:var(--muted);font-weight:700;margin-right:2px}
.picks .lbl+.lbl,.picks .slot+.lbl{margin-left:8px}
.slot{--mc:var(--m-nm);display:inline-block;font-family:var(--f-mono);font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,var(--surface));border-bottom:3px solid transparent}
.slot.HD{--mc:var(--m-hd)}.slot.HR{--mc:var(--m-hr)}.slot.DT{--mc:var(--m-dt)}.slot.FM{--mc:var(--m-fm)}.slot.TB{--mc:var(--m-tb)}
.slot.wa{border-bottom-color:var(--accent)}.slot.wb{border-bottom-color:var(--lower)}
.slot.ban{text-decoration:line-through 2px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mc) 40%,transparent)}
@media (max-width:520px){.side .av{display:none}.sc{font-size:1.2rem}}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.tab{position:relative;flex:none;padding:10px 12px;border:0;border-radius:6px 6px 0 0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;cursor:pointer;font-family:inherit}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline-offset:-3px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}

/* Calendario: las fases son una secuencia, así que van numeradas como el combo de un slider */
.tl{overflow-x:auto;padding:4px 2px 8px}
.tl ol{list-style:none;margin:0;padding:0;display:flex;min-width:max-content;counter-reset:combo}
.tl li{position:relative;padding:44px 22px 0 0;min-width:140px;display:grid;gap:2px;align-content:start;counter-increment:combo}
.tl li::before{content:"";position:absolute;top:13px;left:0;right:0;height:8px;border-radius:8px;background:var(--surface-2)}
.tl li:last-child::before{right:auto;width:34px}
.tl li.past::before,.tl li.now::before{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.tl li::after{content:counter(combo);position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:.95rem;background:var(--surface);color:var(--muted);border:3px solid var(--line)}

/* Los campos llevan un borde más marcado (--field, 3:1 como mínimo) que tarjetas y separadores, para que se vea dónde escribir. */

/* Mappool */
.maps{display:grid;gap:8px}
.map{display:grid;grid-template-columns:64px 96px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.map .slot{font-size:.9rem;padding:8px 0;text-align:center;width:64px;background:var(--mc);color:var(--slot-ink);border:0;border-radius:0;clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%)}

@media (max-width:700px){.map,.maps.nocover .map{grid-template-columns:52px minmax(0,1fr)}.map .slot{width:52px}.map .cover{display:none}.map .st{grid-column:1/-1;flex-wrap:wrap;gap:6px 12px}}

.bracket{overflow-x:auto;padding-bottom:10px}

.bm-row .v{font-family:var(--f-display);font-weight:900;text-align:right}
.bm-row.w{background:var(--accent-soft)}
.lowerb .bm-row.w{background:var(--lower-soft)}
.bm-row.l .n,.bm-row.l .v{color:var(--muted);font-weight:500}
.bm-row.t .n{color:var(--muted);font-style:italic;font-weight:500}
.bm-f{font-size:.7rem;color:var(--muted);padding:3px 9px;background:var(--surface-2);font-family:var(--f-mono);display:flex;justify-content:space-between;gap:6px}

/* Stats */
.bars{display:grid;gap:9px}

.qr-list{display:grid;gap:0;padding-block:4px}

/* Con el dedo: controles de al menos 44 px de alto */
@media (pointer:coarse){

}
.qs-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qs-p{display:flex;flex-wrap:wrap;gap:6px}

.qs-n.me{border-color:var(--accent);font-weight:600}

/* Formularios */
form.f{display:grid;gap:14px;max-width:560px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.9rem}
.flash{padding:12px 14px;border-radius:10px;font-weight:600;font-size:.9rem}

.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile .meta{display:grid;gap:2px}
.adm{display:grid;gap:16px;align-content:start}
.pv{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.pv.ok{opacity:.75}
.pv-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pv-h .field{min-width:170px}
.pv-slots{display:flex;flex-wrap:wrap;gap:4px}
.pv>.btn{justify-self:start}
.pv .it span{min-width:0;overflow-wrap:anywhere}
.pv-done{color:var(--accent);font-size:.85rem}
.note.bad{border-left-color:var(--live);background:color-mix(in srgb,var(--live) 12%,transparent)}
.adm h3{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mini{display:grid;gap:6px}
.mini .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.88rem;flex-wrap:wrap}
.mini .it span{min-width:0;overflow-wrap:anywhere}

/* Barra de vista previa */
.demo{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.demo .wrap{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:10px;font-size:.85rem}
.demo b{font-family:var(--f-display);font-weight:900;font-size:.9rem}
.demo label{display:flex;align-items:center;gap:8px}
.demo select{background:var(--surface);color:var(--ink);border:0;padding:6px 10px}
.demo span{opacity:.75}
.foot{border-top:1px solid var(--line);padding-block:24px 100px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:14px}
/* Directo de Twitch: aviso en la cabecera y ventana flotante (el reproductor mide al menos 400×300, como pide Twitch) */
.top .pill.live{border:0;cursor:pointer;font-family:inherit;flex:none}
.twlive{position:fixed;right:16px;bottom:16px;z-index:25;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

.twlive.player{width:560px}
.lv-thumb{display:block;position:relative;aspect-ratio:16/9;background:var(--surface-2)}

.lv-thumb .pill{position:absolute;left:10px;top:10px}
.lv-b{padding:10px 12px 12px;display:grid;gap:4px}
.lv-t{font-weight:700;font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv-b .row{margin-top:6px;gap:8px}
.lv-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:.85rem}

.lv-bar a{font-weight:600}
.lv-x{position:absolute;right:8px;top:8px;z-index:1;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;line-height:1;cursor:pointer}
.lv-bar .lv-x{position:static;background:var(--surface-2);color:var(--ink);flex:none}
.twlive iframe{display:block;width:560px;height:315px;border:0}

<script>
'use strict';
/* =====================================================================
   SpiSix: Fall Cup, web pública.

   ===================================================================== */
const DEFAULT_CONFIG = {
  nombre:'SpiSix: Fall Cup', sigla:'SPI', comunidad:'SpiSix', zona:'Europe/Madrid',
  rango:{min:100000,max:999999,excepciones:[]}, paises:null, clasificados:16, metodoClasif:'zsum',
  multiplicadores:{EZ:1.8,EZHD:2.0},

    {key:'registros',nombre:'Registros',inicio:'2026-10-28',fin:'2026-11-07'},
    {key:'qualifiers',nombre:'Clasificatorios',showcase:'2026-11-08',inicio:'2026-11-09',fin:'2026-11-15',sr:5.4},
    {key:'octavos',nombre:'Octavos',showcase:'2026-11-16',inicio:'2026-11-17',fin:'2026-11-22',sr:5.2,bo:9},

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=hashStr(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function tzOffset(ms,tz){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(ms);const g=t=>+p.find(x=>x.type===t).value;return Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))-ms}
function zoned(str,end,tz){const [d,t]=String(str).split('T');const [Y,M,D]=d.split('-').map(Number);const [h,mi,s]=t?t.split(':').map(Number):end?[23,59,59]:[0,0,0];const g=Date.UTC(Y,M-1,D,h,mi||0,s||0);return g-tzOffset(g,tz)}
function toLocalInput(ms,tz){if(!ms) return '';const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(ms);const g=t=>p.find(x=>x.type===t).value;return `${g('year')}-${g('month')}-${g('day')}T${g('hour')}:${g('minute')}`}
function initials(n){const c=String(n).replace(/[^A-Za-z0-9]/g,'');return (c.slice(0,2)||'??').toUpperCase()}
function sortSlots(a,b){return MODS.indexOf(a.slot.slice(0,2))-MODS.indexOf(b.slot.slice(0,2))||(parseInt(a.slot.slice(2))||0)-(parseInt(b.slot.slice(2))||0)}

const BRACKET=(()=>{
  const so=[1,16,8,9,5,12,4,13,3,14,6,11,7,10,2,15], L=[];
  const add=(id,fase,ronda,lado,col,a,b)=>L.push({id,fase,ronda,lado,col,srcA:a,srcB:b});
  for(let i=1;i<=8;i++) add('u1-'+i,'octavos','Upper · Octavos','W',0,{q:so[2*i-2]},{q:so[2*i-1]});
  for(let i=1;i<=4;i++) add('u2-'+i,'cuartos','Upper · Cuartos','W',1,{m:'u1-'+(2*i-1),r:'W'},{m:'u1-'+(2*i),r:'W'});
  for(let i=1;i<=4;i++) add('l1-'+i,'cuartos','Lower · Ronda 1','L',0,{m:'u1-'+(2*i-1),r:'L'},{m:'u1-'+(2*i),r:'L'});
  for(let i=1;i<=2;i++) add('u3-'+i,'semis','Upper · Semifinal','W',2,{m:'u2-'+(2*i-1),r:'W'},{m:'u2-'+(2*i),r:'W'});
  for(let i=1;i<=4;i++) add('l2-'+i,'semis','Lower · Ronda 2','L',1,{m:'l1-'+i,r:'W'},{m:'u2-'+(5-i),r:'L'});

  add('l5-1','finals','Lower · Semifinal','L',4,{m:'l4-1',r:'W'},{m:'l4-2',r:'W'});

let S=null, T=null, DEMO=false, LOADED=Date.now();
const nowMs=()=>DEMO?S.now:S.now+(Date.now()-LOADED);

function computeQual(players){
  const pool=(S.pools.qualifiers||[]);
  const bids=pool.map(m=>String(m.beatmap_id));
  const rows=[];
  for(const [uid,maps] of Object.entries(S.qual.scores||{})){
    const p=players.get(+uid); if(!p) continue; // solo inscritos
    rows.push({player:p,scores:bids.map(b=>maps[b]||0)});
  }
  rows.forEach(r=>{r.total=r.scores.reduce((a,b)=>a+b,0);r.z=0});
  bids.forEach((_,j)=>{const v=rows.map(r=>r.scores[j]);const mean=v.reduce((a,b)=>a+b,0)/(v.length||1);const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(v.length||1))||1;rows.forEach(r=>r.z+=(r.scores[j]-mean)/sd)});
  const byZ=S.config.metodoClasif!=='suma';
  rows.sort((a,b)=>byZ?b.z-a.z:b.total-a.total);
  rows.forEach((r,i)=>{r.seed=i+1});
  return {pool,rows};
}

// server/bracket.js repite este cálculo (seeds y cruces) para el bot de arbitraje: si cambias uno, cambia el otro.
function compute(){
  const C=S.config, NOW=nowMs();
  makeFmt(C.zona);
  const phases=C.fases.map(f=>({...f,start:zoned(f.inicio,false,C.zona),end:zoned(f.fin,true,C.zona),sc:f.showcase?zoned(f.showcase,false,C.zona):null}));
  phases.forEach(p=>p.estado=NOW>p.end?'past':NOW>=p.start?'now':'future');
  const cur=phases.find(p=>p.estado==='now')||phases.find(p=>p.estado==='future')||phases[phases.length-1];
  const phaseBy=Object.fromEntries(phases.map(p=>[p.key,p]));
  const players=new Map(S.players.map(p=>[p.id,{...p}]));
  const qual=computeQual(players);
  qual.rows.forEach(r=>r.player.qseed=r.seed);
  const seedsFinal=NOW>phaseBy.qualifiers.end&&qual.rows.length>=C.clasificados;

  const matches=BRACKET.map(b=>({...b})), byId={};
  matches.forEach(m=>byId[m.id]=m);
  const src=s=>{
    if(s.q) return seedsFinal?qual.rows[s.q-1].player:null;
    const m=byId[s.m]; if(!m||m.estado!=='done') return null;
    return s.r==='W'?m.winner:m.loser;
  };
  const perPhase={};
  matches.forEach(m=>{(perPhase[m.fase]=perPhase[m.fase]||[]).push(m)});
  matches.forEach(m=>{
    m.a=src(m.srcA); m.b=src(m.srcB);
    const p=phaseBy[m.fase]; m.bo=p.bo||9; m.need=(m.bo+1)/2;
    if(S.demo) demoFill(m,p,perPhase[m.fase].indexOf(m),perPhase[m.fase].length,NOW);
    const rec=S.matches[m.id]||{};
    Object.assign(m,{time:rec.time||null,ref:rec.ref||null,mp:rec.mp||null,ff:rec.ff||null,bans:rec.bans||[],protects:rec.protects||[],result:rec.result||null});
    m.sa=m.a&&m.result?(m.result.wins?.[m.a.id]||0):0;
    m.sb=m.b&&m.result?(m.result.wins?.[m.b.id]||0):0;
    if(!m.a||!m.b) m.estado='tbd';
    else if(m.ff){m.estado='done';m.winner=m.ff==='a'?m.a:m.b;m.loser=m.ff==='a'?m.b:m.a}
    else if(m.sa>=m.need||m.sb>=m.need){m.estado='done';m.winner=m.sa>m.sb?m.a:m.b;m.loser=m.sa>m.sb?m.b:m.a}
    else if(m.time&&NOW>=m.time&&(m.mp||m.sa+m.sb>0)) m.estado='live';
    else if(m.time) m.estado='sched';
    else m.estado='unset';
  });

  // estado de cada jugador
  const status=new Map();
  players.forEach(p=>status.set(p.id,{k:'reg',txt:'Inscrito'}));
  qual.rows.forEach(r=>status.set(r.player.id,seedsFinal?(r.seed<=C.clasificados?{k:'in',txt:'Seed '+r.seed}:{k:'out',txt:'No clasificado'}):{k:'reg',txt:'Clasificatorios jugados'}));
  matches.filter(m=>m.estado!=='tbd'&&m.lado==='L').forEach(m=>[m.a,m.b].forEach(p=>{if(status.get(p.id).k==='in') status.set(p.id,{k:'lower',txt:'En lower bracket'})}));
  matches.filter(m=>m.estado==='done').forEach(m=>{
    if(m.lado!=='W') status.set(m.loser.id,{k:'out',txt:'Eliminado · '+m.ronda.replace(' · ',' ')});
    if(m.id==='gf') status.set(m.winner.id,{k:'champ',txt:'Campeón'});
  });
  return {C,NOW,phases,phaseBy,cur,players,qual,seedsFinal,matches,byId,status};
}

function demoFill(m,p,k,n,NOW){
  if(S.matches[m.id]) return;
  const days=Math.max(1,Math.round((p.end-p.start)/DAY));
  const t=p.start+Math.floor(k*days/n)*DAY+(18+(k%3)*1.5)*HOUR;
  const rec={time:t,ref:pick(rng(m.id),['Gofio','Kestrel','Marlín','Nerea_ref']),mp:null,ff:null,bans:[],result:null};
  S.matches[m.id]=rec;
  if(!m.a||!m.b||NOW<t) return;
  const r=rng('res'+m.id), sa=DEMO_SKILL.get(m.a.id)||1, sb=DEMO_SKILL.get(m.b.id)||1, pA=sa**4/(sa**4+sb**4);
  const need=((p.bo||9)+1)/2, pool=(S.pools[m.fase]||[]).filter(x=>x.slot!=='TB');
  const used=new Set(), take=()=>{const av=pool.filter(x=>!used.has(x.slot));if(!av.length) return null;const x=pick(r,av);used.add(x.slot);return x};
  for(let i=0;i<4;i++){const x=take();if(x) rec.bans.push(x.slot)}
  const maps=[], wins={[m.a.id]:0,[m.b.id]:0};
  while(wins[m.a.id]<need&&wins[m.b.id]<need){
    const tb=wins[m.a.id]===need-1&&wins[m.b.id]===need-1;
    const x=tb?(S.pools[m.fase]||[]).find(y=>y.slot==='TB'):take(); if(!x) break;
    const w=r()<pA?m.a.id:m.b.id; wins[w]++; maps.push({bid:x.beatmap_id,slot:x.slot,w,scores:{}});
  }
  const live=NOW<t+95*MIN;
  const shown=live?maps.slice(0,Math.max(1,Math.floor(maps.length*(NOW-t)/(95*MIN)))):maps;
  const w2={[m.a.id]:0,[m.b.id]:0}; shown.forEach(x=>w2[x.w]++);
  rec.mp=127000000+(hashStr(m.id)%900000);
  rec.result={wins:w2,maps:shown,updated:NOW};
}

function bracketCard(m){
  const row=(p,s,score,isW)=>{
    const st=!p?'t':m.estado==='done'?(isW?'w':'l'):'';
    return `<div class="bm-row ${st}"><span class="s">${p&&p.qseed?p.qseed:''}</span><span class="n">${p?esc(p.username):esc(srcLabel(s))}</span><span class="v">${(m.estado==='done'||m.estado==='live')?(m.ff?(isW?'W':'FF'):score):''}</span></div>`;
  };
  const foot=m.estado==='live'?'EN DIRECTO':m.time?`${corto(m.time)} ${hora(m.time)}`:'sin fecha';
  return `<div class="bm ${m.estado}">${row(m.a,m.srcA,m.sa,m.winner&&m.winner===m.a)}${row(m.b,m.srcB,m.sb,m.winner&&m.winner===m.b)}<div class="bm-f"><span>${m.id.toUpperCase()}</span><span>${foot}</span></div></div>`;
}

  cuadro(){
    const col=(title,ms,lower)=>`<div class="bcol ${lower?'lowerb':''}"><h4>${title}</h4><div class="stack">${ms.map(bracketCard).join('')}</div></div>`;
    const W=[0,1,2,3].map(i=>T.matches.filter(m=>m.lado==='W'&&m.col===i));
    const L=[0,1,2,3,4,5].map(i=>T.matches.filter(m=>m.lado==='L'&&m.col===i));
    return `<section><div class="sec-head"><div><span class="eyebrow">Doble eliminación · ${T.C.clasificados} jugadores</span><h2>Cuadro</h2></div><span class="muted">El número es la seed de clasificatorios.</span></div>
      <h3><span class="pill acc">Upper bracket</span></h3>
      <div class="bracket" tabindex="0" role="region" aria-label="Upper bracket"><div class="bcols">${['Octavos','Cuartos','Semifinal','Final upper'].map((l,i)=>col(l,W[i])).join('')}${col('Grand Final',[T.byId.gf])}</div></div>
      <h3><span class="pill low">Lower bracket</span></h3>
      <div class="bracket" tabindex="0" role="region" aria-label="Lower bracket"><div class="bcols">${['Ronda 1','Ronda 2','Ronda 3','Ronda 4','Semifinal','Final lower'].map((l,i)=>col(l,L[i],true)).join('')}</div></div>
    </section>`;
  },

  stats(){
    const played=T.matches.filter(m=>(m.estado==='done'||m.estado==='live')&&m.result?.maps?.length);
    if(!played.length) return `<section><h2>Estadísticas</h2><div class="empty">Las estadísticas aparecen cuando se juegan los primeros partidos del cuadro.</div></section>`;
    const pickC={},banC={},pw={};
    played.forEach(m=>{
      const ph=T.phaseBy[m.fase].nombre;
      m.result.maps.forEach(x=>{const k=ph+' '+x.slot;pickC[k]=(pickC[k]||0)+1;const w=x.w===m.a.id?m.a:m.b,l=w===m.a?m.b:m.a;[w,l].forEach(p=>pw[p.id]=pw[p.id]||{p,w:0,n:0});pw[w.id].w++;pw[w.id].n++;pw[l.id].n++});
      m.bans.forEach(s=>{const k=ph+' '+s;banC[k]=(banC[k]||0)+1});
    });
    const top=(o,n)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n);
    const bars=(rows,max,fmt,low)=>rows.length?`<div class="bars ${low?'low':''}">${rows.map(([k,v])=>`<div class="bar"><span class="k" title="${esc(k)}">${esc(k)}</span><span class="tr"><i style="width:${Math.max(4,v/max*100)}%"></i></span><span class="v">${fmt(v)}</span></div>`).join('')}</div>`:'<p class="muted">Sin datos todavía.</p>';
    const tp=top(pickC,8),tb=top(banC,8);
    const wr=Object.values(pw).filter(x=>x.n>=6).map(x=>[x.p.username,x.w/x.n]).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const maps=played.reduce((a,m)=>a+m.result.maps.length,0);
    return `<section><span class="eyebrow">Cuadro</span><h2>Estadísticas</h2>
      <div class="kpis"><div class="kpi"><b>${played.length}</b><span>partidos jugados</span></div><div class="kpi"><b>${maps}</b><span>mapas jugados</span></div><div class="kpi"><b>${dec(maps/played.length)}</b><span>mapas por partido</span></div><div class="kpi"><b>${T.matches.filter(m=>m.estado!=='done').length}</b><span>partidos por jugar</span></div></div></section>
      <div class="grid2">
        <section class="card"><h3>Mapas más elegidos</h3>${bars(tp,tp[0]?.[1]||1,v=>v)}</section>
        <section class="card"><h3>Mapas más baneados</h3>${bars(tb,tb[0]?.[1]||1,v=>v,true)}</section>
        <section class="card"><h3>Mejor % de mapas ganados</h3><p class="muted" style="font-size:.85rem">Mínimo 6 mapas jugados.</p>${bars(wr,1,v=>Math.round(v*100)+'%')}</section>
      </div>`;
  },

  registro(){
    const reg=T.phaseBy.registros, NOW=T.NOW, me=S.me, open=NOW>=reg.start&&NOW<=reg.end, url=T.C.formulario;
    const head=`<section><span class="eyebrow">${rangoFechas(reg.start,reg.end)}</span><h2>Registro</h2>${flashHtml()}`;
    const loginErr=new URLSearchParams(location.search).get('login');
    const errNote=loginErr?`<p class="flash err">${loginErr==='cancelado'?'Has cancelado el inicio de sesión en osu!.':'El inicio de sesión ha caducado. Vuelve a intentarlo.'}</p>`:'';
    const form=!open?`<p class="note">Los registros están cerrados${NOW<reg.start?`; abren el ${dia(reg.start)}`:''}.</p>`
      :/^https:\/\//.test(url||'')?`<p><a class="btn btn-primary" href="${esc(url)}" target="_blank" rel="noopener">Ir al formulario</a></p>`
      :'<p class="note">Pide el enlace al formulario a la organización.</p>';
    if(!me) return head+errNote+`<div class="card prose"><p>${linesHtml(txt('registro',DEFAULT_REGISTRO))}</p>${form}
      <p>¿Ya estás inscrito? Inicia sesión con osu! para apuntarte a un lobby de clasificatorios.</p>${S.configured?'<p><a class="btn btn-ghost" href="/auth/osu">Iniciar sesión con osu!</a></p>':''}</div></section>`;
    const profile=`<div class="profile">${av(me,'xl')}<div class="meta"><b style="font-size:1.15rem">${esc(me.username)}</b><span class="muted num">${me.rank?'Rango #'+nf.format(me.rank):'Sin rango'}${me.country?' · '+esc(me.country):''}</span></div></div>`;
    if(me.registered) return head+`<div class="card prose">${profile}<p class="flash ok">Estás inscrito${me.availability?' · Disponibilidad: '+esc(me.availability):''}.</p>
      <p><a class="btn btn-primary" href="#qualis">Apuntarme a un lobby de clasificatorios</a></p>
      <p class="muted" style="font-size:.85rem">Para retirarte, habla con la organización.</p></div></section>`;
    return head+`<div class="card prose">${profile}<p>Todavía no apareces como inscrito. Si ya has rellenado el formulario, la organización te añadirá en cuanto importe las respuestas.</p>${form}</div></section>`;
  },

  qualis(){
    const fase=T.phaseBy.qualifiers, NOW=T.NOW, me=S.me, all=S.qual.slots||[], names=new Map(S.players.map(p=>[p.id,p]));
    const mine=me?all.find(x=>x.players.includes(me.id)):null, minePending=Boolean(mine?.pending.includes(me.id)), mineStarted=mine&&!minePending&&NOW>=mine.time;
    // Los que ya han pasado sin nadie no le sirven a nadie.
    const slots=all.filter(x=>NOW<x.time||x.players.length||x.mp);
    const head=`<section><span class="eyebrow">${rangoFechas(fase.start,fase.end)}</span><h2>Lobbies de clasificatorios</h2>${flashHtml()}
      <p class="muted">${linesHtml(txt('qualis',DEFAULT_QUALIS))}</p>`;
    const notice=!me?`<p class="note">Inicia sesión con osu! para apuntarte.${S.configured?' <a href="/auth/osu">Iniciar sesión</a>':''}</p>`
      :!me.registered&&me.referee?'<p class="muted">Pulsa Arbitrar en los lobbies que vayas a llevar.</p>'
      :!me.registered?'<p class="note">Solo pueden apuntarse los inscritos. Si ya has rellenado el formulario, la organización te añadirá en cuanto importe las respuestas.</p>'
      :minePending&&NOW>=mine.time?`<p class="note bad">${esc(mine.name)} ya ha empezado y tu plaza no llegó a aprobarse. Apúntate a otro lobby.</p>`
      :minePending?`<p class="note">Has pedido plaza en <b>${esc(mine.name)}</b>, el ${dia(mine.time)} a las ${hora(mine.time)}. Falta que un árbitro o admin la apruebe.</p>`
      :mine?`<p class="flash ok">Estás en <b>${esc(mine.name)}</b>, el ${dia(mine.time)} a las ${hora(mine.time)}.</p>`
      :slots.length?'<p class="note">Todavía no estás en ningún lobby.</p>':'';
    const no=me?.qualRejection;
    const refused=no?`<p class="note bad">Han rechazado tu plaza en ${esc(no.lobby)}, el ${dia(no.time)} a las ${hora(no.time)}.${no.reason?` Motivo: ${esc(no.reason)}.`:''} Puedes apuntarte a otro lobby.</p>`:'';
    const extra=extraBlock(mineStarted), asks=refused+seatRequests()+extraRequests();
    if(!slots.length) return head+notice+asks+`<div class="empty">${all.length?'Ya no quedan lobbies disponibles: todos han empezado.':'La organización todavía no ha abierto los lobbies.'}</div>`+extra+'</section>';
    // Todos a la vista, por días: primero los que se están jugando, luego los que aún se pueden elegir y al final los que ya han empezado o terminado.
    const byDay=(list,title=d=>d)=>[...new Set(list.map(x=>dayOf(x.time)))].map(d=>{
      const rows=list.filter(x=>dayOf(x.time)===d);
      return `<div class="qd"><h3>${esc(title(dia(rows[0].time)))}</h3><div class="qr-list card">${rows.map(row).join('')}</div></div>`;
    }).join('');
    const row=x=>{
      const started=NOW>=x.time, isMine=mine?.id===x.id, full=x.players.length>=x.size, isRef=me&&x.ref_id===me.id;
      const play=!me?.registered||started||isRef||(mineStarted&&!isMine)?'':isMine
        ?'<button class="btn btn-ghost btn-sm" type="button" data-act="qs-leave">Salir</button>'
        :full?'':`<button class="btn ${mine?'btn-ghost':'btn-primary'} btn-sm" type="button" data-act="qs-join" data-id="${x.id}">${mine?'Cambiarme':'Apuntarme'}</button>`;
      const ref=!me?.referee||started||isMine?'':isRef
        ?`<button class="btn btn-ghost btn-sm" type="button" data-act="qs-claim" data-id="${x.id}" data-on="0">Dejar de arbitrar</button>`
        :x.ref_id?'':`<button class="btn btn-ghost btn-sm" type="button" data-act="qs-claim" data-id="${x.id}" data-on="1">Arbitrar</button>`;
      return `<div class="qr ${isMine?'mine':''}"><div class="qr-id"><b>${esc(x.name)}</b><span class="muted num">${hora(x.time)}</span></div>
        <div class="qs-p">${x.players.map(id=>{const p=names.get(id),wait=x.pending.includes(id);return p?`<span class="qs-n ${id===me?.id?'me':''} ${wait?'pend':''}">${av(p)}${esc(p.username)}${wait?' <small>pendiente</small>':''}</span>`:''}).join('')||`<span class="muted" style="font-size:.85rem">${started?'Sin jugadores':'Libre'}</span>`}</div>
        <div class="qr-m muted"><span class="num">${x.players.length}/${x.size}</span> · ${x.ref_name?'Árbitro: '+esc(x.ref_name):'Sin árbitro'}${x.mp?` · <a href="${mpUrl(x.mp)}" target="_blank" rel="noopener">MP</a>`:''}</div>
        <div class="qs-r">${started?SLOT_PILL[x.state]||SLOT_PILL.started:full&&!isMine?'<span class="pill">Lleno</span>':''}${play}${ref}</div></div>`;
    };
    const go=extra?'<div><button class="btn btn-ghost btn-sm" type="button" data-act="qx-go">¿No te viene bien ninguna hora?</button></div>':'';
    const st=x=>NOW<x.time?'open':x.state||'started';
    return head+notice+asks+go+byDay(slots.filter(x=>st(x)==='live'),d=>'Jugándose ahora · '+d)+byDay(slots.filter(x=>st(x)==='open'))
      +byDay(slots.filter(x=>st(x)==='started'),d=>'Ya empezados · '+d)+byDay(slots.filter(x=>st(x)==='done'),d=>'Terminados · '+d)+extra+'</section>';
  },

          ${S.players.map(p=>`<tr><td>${esc(p.username)}</td><td class="n">#${nf.format(p.rank||0)}</td><td>${esc(p.availability||'Sin indicar')}</td><td><button class="btn btn-ghost btn-sm" type="button" data-act="player-del" data-id="${p.id}" data-name="${esc(p.username)}">Quitar</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nadie inscrito.</td></tr>'}
          </tbody></table></div>
        </section>
      </div></section>`;
  }
};
const RULES_DEF={bans:2,protects:1,banEvery:4,pickTimer:90};
const rulesOf=k=>S.rules?.[k]||RULES_DEF;
function banLines(){
  const rs=T.phases.filter(p=>p.bo).map(p=>({p,r:rulesOf(p.key)})), every=[...new Set(rs.map(x=>x.r.banEvery))];
  return [`- Los bans van por tandas, uno cada jugador en cada tanda: la primera al empezar y otra cada ${every.length===1?every[0]+' mapas jugados':'pocos mapas (según la ronda)'}, hasta completar los bans de la ronda.`,
    `- Bans y protects de cada jugador: ${rs.map(x=>`${x.p.nombre}, ${x.r.bans} ${x.r.bans===1?'ban':'bans'} y ${x.r.protects} protect${x.r.protects===1?'':'s'}${every.length>1?` (tanda cada ${x.r.banEvery} mapas)`:''}`).join(' · ')}.`];
}

function inlineText(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/https?:\/\/(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<])+/g,u=>{const end=u.match(/[.,;:)]+$/)?.[0]||'',h=u.slice(0,u.length-end.length);return `<a href="${h}" target="_blank" rel="noopener">${h}</a>${end}`});
}
function parseSections(text){
  const secs=[];let cur=null,list=null;
  const open=title=>{cur={title,body:[]};list=null;secs.push(cur)};
  for(const raw of text.split('\n')){
    const l=raw.trim();
    if(!l){list=null;continue}
    if(l.startsWith('## ')){open(l.slice(3).trim());continue}
    if(!cur) open('');
    if(/^[-•*] /.test(l)){if(!list){list=[];cur.body.push(list)}list.push(l.slice(2).trim())}
    else{list=null;cur.body.push(l)}
  }
  return secs;
}

async function poolRead(data,file){
  UI.poolBusy='Leyendo…';UI.flash=null;keepRender();
  try{
    const r=await post('/api/admin/pool/read',data);
    r.groups.forEach(g=>{g.round=g.suggest||'';g.status=''});
    r.file=file||'';UI.poolRead=r;UI.poolText='';
  }catch(e){UI.flash={ok:false,text:e.message}}
  UI.poolBusy=null;keepRender();
}
async function poolImport(){
  const R=UI.poolRead, todo=R.groups.filter(g=>g.round&&g.status!=='ok');
  let n=0,failed=0;
  for(const g of todo){
    UI.poolBusy=`Importando ${g.name} (${++n} de ${todo.length})…`;g.error=null;g.result=null;keepRender();
    try{
      const r=await post('/api/admin/pool/import',{round:g.round,maps:g.maps.map(({slot,beatmap,text})=>({slot,beatmap,text}))});
      g.status='ok';g.result=r.warnings;
    }catch(e){g.error=e.message;failed++}
  }
  UI.poolBusy=null;
  UI.flash={ok:!failed,text:failed?`Se importaron ${todo.length-failed} de ${todo.length} rondas. Las demás se han quedado como estaban: mira el motivo en cada una.`:`Importadas ${todo.length} ${todo.length===1?'ronda':'rondas'}. Revisa los avisos, si los hay.`};
  await load();
}

function keepRender(){
  const ae=document.activeElement, fid=ae&&app.contains(ae)?ae.id:null;
  let sel=null; try{if(fid&&ae.selectionStart!=null) sel=[ae.selectionStart,ae.selectionEnd]}catch(_){}
  const vals={}; app.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{if(e.dataset.keep!=='no') vals[e.id]=e.type==='checkbox'?e.checked:e.value});
  const logs=[...app.querySelectorAll('.rlog[id]')].map(e=>({id:e.id,end:e.scrollHeight-e.scrollTop-e.clientHeight<30,top:e.scrollTop}));
  const y=scrollY;
  render();
  for(const [id,v] of Object.entries(vals)){const e=document.getElementById(id);if(!e) continue;if(e.type==='checkbox') e.checked=v;else if(e.tagName!=='SELECT'||[...e.options].some(o=>o.value===v)) e.value=v}
  logs.forEach(l=>{const e=document.getElementById(l.id);if(e) e.scrollTop=l.end?e.scrollHeight:l.top});
  if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});if(sel) try{e.setSelectionRange(...sel)}catch(_){}}}
  scrollTo(0,y);
}
async function refAct(path,data,okText,then){

  catch(e){ok=false;UI.flash={ok:false,text:e.message}}
  keepRender();
  return ok;
}

const NAV=[['inicio','Inicio'],['info','Info'],['jugadores','Jugadores'],['mappool','Mappool'],['partidos','Partidos'],['cuadro','Cuadro'],['stats','Stats'],['qualis','Qualis'],['registro','Registro'],['arbitrar','Arbitrar'],['admin','Admin']];

// La URL guarda la vista y su pestaña (#mappool/semis, #partidos/cuartos, #jugadores/clasif), para enlazarlas.
function route(){const [v,sub]=location.hash.slice(1).split('/');let s=null;try{s=sub?decodeURIComponent(sub):null}catch(_){}return {v,sub:s}}
function readRoute(){const {v,sub}=route();if(!sub) return;if(v==='partidos') UI.fase=sub;else if(v==='mappool') UI.pool=sub;else if(v==='jugadores'&&(sub==='lista'||sub==='clasif')) UI.jug=sub}

function currentView(){const h=route().v;if(h==='admin'&&!S.me?.admin||h==='arbitrar'&&!S.me?.referee) return 'inicio';return VIEWS[h]?h:'inicio'}

// Datos de ejemplo solo sin servidor (archivo abierto en local, hosting estático o ?demo). Si el servidor
// existe pero falla, no se inventa nada: se avisa y se reintenta, o se mantienen los últimos datos cargados.
async function load(){
  let r=null, data=null;
  try{
    r=await fetch('/api/state',{credentials:'same-origin',headers:{Accept:'application/json'}});
    if(r.ok&&(r.headers.get('content-type')||'').includes('json')) data=await r.json();
  }catch(e){}
  if(data){S=data;DEMO=false;LOADED=Date.now();return render()}
  if(DEMO) return;
  const noServer=location.protocol==='file:'||new URLSearchParams(location.search).has('demo')||!r||r.status===404;
  if(!S&&noServer){
    DEMO=true; S=demoState();
    document.getElementById('demoBar').hidden=false;
    return render();
  }
  if(!S) app.innerHTML='<div class="empty">No se ha podido conectar con el servidor. Se volverá a intentar en unos segundos.</div>';
  setTimeout(load,15e3);
}
// Cada minuto se recargan los datos (resultados en directo, nuevos inscritos), salvo en Admin y Registro
// para no borrar lo que se está escribiendo. Se conserva el desplazamiento horizontal del cuadro y las tablas.
setInterval(async()=>{
  if(!S||DEMO||document.hidden||UI.busy||['admin','arbitrar'].includes(currentView())||document.activeElement?.id==='q'||(currentView()==='qualis'&&(app.querySelector('input:focus')||[...app.querySelectorAll('#q-xn,#q-xt,[id^=qa-r],[id^=qx-r]')].some(e=>e.value)))) return;
  const sel='.bracket,.tbl-wrap', pos=[...document.querySelectorAll(sel)].map(e=>e.scrollLeft);
  await load();
  document.querySelectorAll(sel).forEach((e,i)=>{if(pos[i]) e.scrollLeft=pos[i]});
},60e3);

async function post(path,data){
  if(DEMO) throw new Error('En la vista previa no se guarda nada.');
  const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Error '+r.status);
  return j;
}
async function act(fn,okText){
  UI.busy=true;UI.flash=null;
  try{const res=await fn();DIRTY=false;UI.flash={ok:!res?.warning,text:res?.warning||(typeof okText==='function'?okText(res):okText)};if(!DEMO) await load();else render()}
  catch(e){UI.flash={ok:false,text:e.message};render()}
  finally{UI.busy=false}
}

  if(a==='role-del') return act(()=>post('/api/admin/role',{id:+b.dataset.id,role:''}),'Rol quitado.');
  if(a==='qs-join') return act(()=>post('/api/qual/signup',{slot:+b.dataset.id}),'Plaza pedida: falta que la aprueben.');
  if(a==='qs-leave') return act(()=>post('/api/qual/leave'),'Ya no estás en ese lobby.');
  if(a==='qs-out') return act(()=>post('/api/admin/qual-slot/remove',{user:+b.dataset.user}),'Jugador quitado del lobby.');
  if(a==='qs-edit'){UI.slotEdit=+b.dataset.id||null;UI.flash=null;return keepRender()}
  if(a==='qa-approve') return act(()=>post('/api/ref/qual-signup/approve',{user:+b.dataset.user}),'Plaza aprobada.');
  if(a==='qa-reject'){const user=+b.dataset.user;return act(()=>post('/api/ref/qual-signup/reject',{user,reason:val('qa-r'+user)}),'Plaza rechazada.')}
  if(a==='tx-reset'){
    const key=b.dataset.key;
    if(UI.textReset!==key){UI.textReset=key;return keepRender()}
    UI.textReset=null;
    return act(()=>post('/api/admin/site-text',{key,text:''}),'Texto original recuperado.');
  }
  if(a==='fa-reset'){
    if(!UI.fasesReset){UI.fasesReset=true;return keepRender()}
    UI.fasesReset=false;
    return act(()=>post('/api/admin/fases',{reset:true}),'Rondas originales recuperadas.');
  }
  if(a==='an-del') return act(()=>post('/api/admin/site-text',{key:'anuncio',text:''}),'Anuncio quitado.');
  if(a==='no-reset'){
    if(!UI.normasReset){UI.normasReset=true;return keepRender()}
    UI.normasReset=false;
    return act(()=>post('/api/admin/site-text',{key:'normas',text:''}),'Las normas vuelven a ser las originales.');
  }
  if(a==='qx-go') return document.getElementById('qx-card')?.scrollIntoView({block:'center'});
  if(a==='qx-cancel') return act(()=>post('/api/qual/request/cancel',{}),'Solicitud cancelada.');
  if(a==='qx-accept'){
    const user=+b.dataset.user, t=val('qx-t'+user);
    return act(()=>post('/api/ref/qual-request/accept',{user,time:t?zoned(t,false,T.C.zona):null,referee:b.dataset.arb==='1'}),r=>`Lobby ${r.name} creado.`);
  }
  if(a==='qx-reject'){const user=+b.dataset.user;return act(()=>post('/api/ref/qual-request/reject',{user,reason:val('qx-r'+user)}),'Solicitud rechazada.')}
  if(a==='qs-claim'){const on=b.dataset.on==='1';return act(()=>post('/api/ref/qual-claim',{id:+b.dataset.id,on}),on?'Arbitras este lobby.':'Ya no arbitras este lobby.')}
  if(a==='qs-empty'){
    const day=b.dataset.day;
    if(UI.slotEmpty!==day){UI.slotEmpty=day;return keepRender()}
    UI.slotEmpty=null;
    return act(()=>post('/api/admin/qual-slot/delete-empty',{day}),r=>`Quitados ${r.removed} lobbies vacíos.`);
  }
  if(a==='qs-del'){
    const id=+b.dataset.id;
    if(UI.slotDel!==id){UI.slotDel=id;return keepRender()}
    UI.slotDel=null;if(UI.slotEdit===id) UI.slotEdit=null;
    return act(()=>post('/api/admin/qual-slot/delete',{id}),'Lobby quitado.');
  }
  if(a==='ref-slot'){b.disabled=true;return refAct('/api/ref/lobby',{slot:+b.dataset.id,replace:b.dataset.replace==='1'},r=>`Lobby creado (MP #${r.mp}). Se ha invitado a los aprobados.${r.pending?` ${r.pending} sin aprobar: apruébalos en Qualis y pulsa Invitar a los aprobados que falten.`:''}`,r=>{UI.ref=r.key})}
  if(a==='rules-set'){
    const k=b.dataset.round, g=x=>val(`a-ru-${k}-${x}`);
    return act(()=>post('/api/admin/rules',{round:k,bans:g('bans'),protects:g('protects'),banEvery:g('banEvery'),pickTimer:g('pickTimer')}),'Reglas guardadas.');
  }
  // Arbitraje
  if(a==='ref-off') return refAct('/api/ref/disconnect',{},'Desconectado de Bancho. La web ya no guarda tu contraseña IRC.');
  if(a==='ref-lobby'){b.disabled=true;b.textContent='Creando…';return refAct('/api/ref/lobby',{match:UI.ref,replace:Boolean(document.getElementById('r-replace')?.checked)},r=>`Lobby creado (MP #${r.mp}). Los jugadores ya tienen la invitación.`)}
  if(a==='ref-attach'){const k=b.dataset.key;b.disabled=true;return refAct('/api/ref/attach',{key:k},null,()=>{UI.ref=k})}
  if(a==='ref-close'){if(!confirm('¿Cerrar el lobby? Bancho lo cierra para todos los jugadores.')) return;return refAct('/api/ref/act',{key:UI.ref,type:'close'})}

  if(a==='ref-reset'){if(!confirm('¿Borrar el roll, el orden, los protects, los bans y los picks apuntados? En el lobby no se manda nada y el marcador sale del MP.')) return;return refAct('/api/ref/act',{key:UI.ref,type:'reset'},'Partido empezado de cero en la web.')}
  if(a==='ref-do'){
    const d=b.dataset, body={key:UI.ref,type:d.type};
    if(d.slot){body.slot=d.slot;if(UI.refForce&&d.type!=='qmap'){body.type=val('r-ftype')||d.type;body.by=val('r-by');body.force=true}}

    if(d.names) body.names=d.names;

app.addEventListener('change',e=>{
  if(e.target.id==='a-mid'){UI.admMatch=e.target.value;UI.flash=null;render()}
  if(e.target.dataset.slotRef) return act(()=>post('/api/admin/qual-slot/ref',{id:+e.target.dataset.slotRef,ref:e.target.value?+e.target.value:null}),'Árbitro guardado.');
  if(e.target.dataset.roleId) return act(()=>post('/api/admin/role',{id:+e.target.dataset.roleId,role:e.target.value}),'Rol cambiado.');
  if(e.target.dataset.pv!==undefined){UI.poolRead.groups[+e.target.dataset.pv].round=e.target.value;return keepRender()}
  if(e.target.id==='a-pfile'){
    const file=e.target.files[0]; if(!file) return;
    UI.poolText=val('a-ptext');
    if(file.size>20*1024*1024){UI.flash={ok:false,text:'El archivo pesa más de 20 MB. Copia solo la pestaña de las mappools.'};return keepRender()}
    return file.arrayBuffer().then(buf=>{
      const bytes=new Uint8Array(buf);let bin='';
      for(let i=0;i<bytes.length;i+=32768) bin+=String.fromCharCode(...bytes.subarray(i,i+32768));
      return poolRead({file:btoa(bin)},file.name);
    },()=>{UI.flash={ok:false,text:'No puedo leer ese archivo. Vuelve a elegirlo.'};keepRender()});
  }
  if(e.target.id==='r-force'){UI.refForce=e.target.checked;return keepRender()}
  if(refPending&&e.target.tagName==='SELECT'){refPending=false;keepRender()}
  if(e.target.id==='a-round'||e.target.id==='a-pround') UI.admRound=e.target.value;
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  const kind=f.dataset.form;
  if(kind==='pool-read'){
    UI.poolText=val('a-ptext');
    if(!UI.poolText.trim()){UI.flash={ok:false,text:'Elige un archivo o pega las filas de la hoja.'};return render()}
    return poolRead({text:UI.poolText});
  }
  if(kind==='pool') UI.admRound=val('a-round');
  if(kind==='pool') return act(()=>post('/api/admin/pool',{round:val('a-round'),slot:val('a-slot'),beatmap:val('a-bm')}),'Mapa añadido con los datos de osu!.');
  if(kind==='qual') return act(()=>post('/api/admin/qual',{mp:mpId(val('a-qmp'))}),'Lobby añadido y leído desde osu!.');
  if(kind==='imp'){
    UI.impText=val('a-imp');
    const btn=f.querySelector('button'); btn.disabled=true; btn.textContent='Importando…';
    return act(async()=>{const r=await post('/api/admin/import',{text:UI.impText});UI.imp=r;UI.impText='';return r},
      r=>`Importación terminada: ${r.imported.length} inscritos nuevos.`+(r.notFound.length||r.rejected.length?' Revisa abajo los que faltan.':''));
  }
  if(kind==='exc') return act(()=>post('/api/admin/exception',{user:val('a-exc')}),'Excepción añadida: ya puede inscribirse aunque su rango esté fuera del límite.');
  if(kind==='role') return act(()=>post('/api/admin/role',{user:val('a-ru'),role:val('a-rr')}),r=>`${r.username} ya es ${ROLE_TXT[r.role].toLowerCase()}.`);
  if(kind==='qs-add') return act(()=>post('/api/admin/qual-slot/assign',{id:+val('a-qal'),user:+val('a-qap')}),'Jugador añadido al lobby.');
  if(kind==='site'){
    const key=f.dataset.key, text=val('a-tx-'+key).trim();
    if(!text){UI.flash={ok:false,text:'Escribe el texto, o pulsa Volver al original.'};return keepRender()}
    UI.textReset=null;
    return act(()=>post('/api/admin/site-text',{key,text}),'Texto guardado.');
  }
  if(kind==='fases'){
    UI.fasesReset=false;
    const fases=T.phases.map(p=>{
      const g=k=>val(`a-f-${p.key}-${k}`), x={key:p.key,nombre:g('nombre'),inicio:g('inicio'),fin:g('fin')};
      if(p.showcase!=null) x.showcase=g('showcase');
      if(p.sr!=null) x.sr=+g('sr');
      if(p.bo!=null) x.bo=+g('bo');
      return x;
    });
    return act(()=>post('/api/admin/fases',{fases}),'Rondas guardadas.');
  }
  if(kind==='anuncio'){
    const text=val('a-an').trim();
    if(!text){UI.flash={ok:false,text:'Escribe el anuncio, o pulsa Quitar el anuncio.'};return keepRender()}
    return act(()=>post('/api/admin/site-text',{key:'anuncio',text}),'Anuncio publicado en Inicio.');
  }
  if(kind==='normas'){
    const text=val('a-no').trim();
    if(!text){UI.flash={ok:false,text:'Escribe las normas, o pulsa Volver a las originales.'};return keepRender()}
    UI.normasReset=false;
    return act(()=>post('/api/admin/site-text',{key:'normas',text}),'Normas guardadas.');
  }
  if(kind==='qx-ask'){
    const t=val('q-xt');
    return act(()=>post('/api/qual/request',{time:t?zoned(t,false,T.C.zona):null,note:val('q-xn')}),'Solicitud enviada.');
  }
  if(kind==='qs-grid'){
    const from=val('a-gf'), to=val('a-gt'), week=new Set([...document.querySelectorAll('.a-gw:checked')].map(x=>+x.value)), days=[];
    if(!from||!to||from>to){UI.flash={ok:false,text:'Elige bien el primer y el último día.'};return keepRender()}
    for(let d=new Date(from+'T12:00:00Z');d.toISOString().slice(0,10)<=to&&days.length<=26;d.setUTCDate(d.getUTCDate()+1)) if(week.has(d.getUTCDay())) days.push(d.toISOString().slice(0,10));
    const times=val('a-gh').split(/[\s,;]+/).filter(Boolean).map(t=>t.replace(/^(\d):/,'0$1:'));
    return act(()=>post('/api/admin/qual-slot/generate',{days,times,size:+val('a-gz')}),r=>`Creados ${r.created} lobbies en ${days.length} ${days.length===1?'día':'días'}.${r.skipped?` ${r.skipped} ya existían a esa hora y se han dejado.`:''}${r.past?` ${r.past} ya han pasado y no se han creado.`:''}${r.late?` ${r.late===1?'Uno empezaría':r.late+' empezarían'} justo cuando se fijan las seeds, y no se ${r.late===1?'ha creado':'han creado'}.`:''}`);
  }
  if(kind==='qs-save'){
    const t=val('a-st');
    if(!t){UI.flash={ok:false,text:'Elige la fecha y la hora del lobby.'};return keepRender()}
    const id=UI.slotEdit;
    return act(async()=>{const r=await post('/api/admin/qual-slot',{...(id?{id}:{}),name:val('a-sn'),time:zoned(t,false,T.C.zona),size:+val('a-sz')});UI.slotEdit=null;return r},id?'Lobby guardado.':'Lobby creado: los jugadores ya pueden apuntarse.');
  }
  // Arbitraje. La contraseña se borra del formulario antes de enviarla: si falla, hay que volver a pegarla.
  if(kind==='ref-conn'){
    const el=document.getElementById('r-pass'), pw=el.value; el.value='';
    if(!pw.trim()){UI.flash={ok:false,text:'Pega tu contraseña IRC.'};return keepRender()}
    const btn=f.querySelector('button'); btn.disabled=true; btn.textContent='Conectando…';
    return refAct('/api/ref/connect',{password:pw},'Conectado a Bancho.');
  }
  if(kind==='ref-order') return refAct('/api/ref/act',{key:UI.ref,type:'order',protect:val('r-o-protect'),ban:val('r-o-ban'),pick:val('r-o-pick')});
  const refText=(id,send)=>{const el=document.getElementById(id), t=el.value.trim(); if(!t) return; el.value=''; return send(t).then(ok=>{if(!ok){const x=document.getElementById(id);if(x&&!x.value) x.value=t}})};
  if(kind==='ref-chat') return refText('r-chat',t=>refAct('/api/ref/chat',{key:UI.ref,text:t}));
  if(kind==='ref-wu') return refText('r-wu',t=>refAct('/api/ref/act',{key:UI.ref,type:'warmup',beatmap:t}));
  if(kind==='ref-inv') return refText('r-inv',t=>refAct('/api/ref/act',{key:UI.ref,type:'invite',names:t}));
  if(kind==='ref-qual') return refText('r-qname',t=>refAct('/api/ref/lobby',{qual:t},r=>`Lobby creado (MP #${r.mp}). Invita a los jugadores.`,r=>{UI.ref=r.key}));
  if(kind==='match'){
    const t=val('a-time');
    return act(()=>post('/api/admin/match',{id:val('a-mid'),time:t?zoned(t,false,T.C.zona):null,ref:val('a-ref'),mp:mpId(val('a-mp'))||null,ff:val('a-ff')||null,bans:val('a-bans').split(/[,\s]+/).filter(Boolean)}),'Partido guardado.');
  }
});

// Menú «Más»: las secciones que no caben en la cabecera pasan a un desplegable. La actual se queda fuera
// mientras quepa; si ni así cabe (móvil), el botón lleva su nombre y el desplegable muestra todas.
function fitNav(){
  const nav=document.getElementById('nav'), more=nav.querySelector('.more'), menu=document.getElementById('navMore');
  if(!more) return;
  const links=[...nav.querySelectorAll(':scope>a')], cur=links.find(a=>a.hasAttribute('aria-current'));
  const over=()=>{const r=nav.getBoundingClientRect().right;return [...nav.children].some(e=>!e.hidden&&e.getBoundingClientRect().right>r+1)};
  links.forEach(a=>a.hidden=false); more.hidden=true; more.classList.remove('solo');
  const label=more.querySelector('.more-btn span'), btn=more.querySelector('.more-btn');
  label.textContent='Más'; btn.removeAttribute('aria-label');
  if(over()){
    more.hidden=false;
    for(const a of links.filter(a=>a!==cur).reverse()){if(!over()) break;a.hidden=true}
    if(over()&&cur){
      cur.hidden=true; more.classList.add('solo');
      label.textContent=cur.textContent; btn.setAttribute('aria-label',`Secciones (ahora: ${cur.textContent})`);
    }
  }
  const hid=links.filter(a=>a.hidden);
  menu.innerHTML=hid.map(a=>`<a href="${a.getAttribute('href')}"${a===cur?' aria-current="page"':''}>${a.innerHTML}</a>`).join('');
  if(!hid.length) closeMore(false);
}
function openMore(focus){
  const b=document.querySelector('.more-btn');
  if(!b||b.closest('.more').hidden) return;
  b.setAttribute('aria-expanded','true'); document.getElementById('navMore').hidden=false;
  if(focus) document.querySelector('#navMore a')?.focus();
}
function closeMore(focus){
  const b=document.querySelector('.more-btn');
  if(!b||b.getAttribute('aria-expanded')!=='true') return;
  b.setAttribute('aria-expanded','false'); document.getElementById('navMore').hidden=true;
  if(focus) b.focus();
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.more-btn');
  // Con teclado (detail 0) el foco pasa a la primera sección del desplegable.
  if(b) return b.getAttribute('aria-expanded')==='true'?closeMore(false):openMore(e.detail===0);
  if(e.target.closest('#navMore a')) closeMore(false);
});
document.getElementById('nav').addEventListener('focusout',e=>{if(!e.relatedTarget?.closest?.('.more')&&e.target.closest('.more')) closeMore(false)});
document.addEventListener('click',e=>{if(!e.target.closest('.more')) closeMore(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.more-btn[aria-expanded="true"]')) closeMore(true)});
let fitRaf=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitNav)});
window.addEventListener('hashchange',()=>{
  UI.flash=null;DIRTY=false;readRoute();render();window.scrollTo(0,0);

// Tema: automático (el del sistema), claro u oscuro. Se recuerda en este navegador.
const THEMES=['auto','light','dark'], THEME_NAME={auto:'automático',light:'claro',dark:'oscuro'};
const THEME_ICON={
  auto:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
};
const themeBtn=document.getElementById('themeBtn');
function setTheme(t,save){
  const root=document.documentElement;
  if(t==='auto') delete root.dataset.theme; else root.dataset.theme=t;
  if(save) try{t==='auto'?localStorage.removeItem('spisix-theme'):localStorage.setItem('spisix-theme',t)}catch(_){}
  const next=THEMES[(THEMES.indexOf(t)+1)%THEMES.length];
  themeBtn.innerHTML=THEME_ICON[t];
  themeBtn.setAttribute('aria-label',`Tema ${THEME_NAME[t]}. Cambiar a ${THEME_NAME[next]}`);
  themeBtn.title=`Tema ${THEME_NAME[t]}`;
  // La barra del navegador del móvil, con el color del tema elegido
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.content=t==='auto'?(m.media.includes('dark')?'#171B28':'#FFFFFF'):t==='dark'?'#171B28':'#FFFFFF');
}
setTheme(document.documentElement.dataset.theme||'auto',false);
themeBtn.addEventListener('click',()=>{const t=document.documentElement.dataset.theme||'auto';setTheme(THEMES[(THEMES.indexOf(t)+1)%THEMES.length],true)});
readRoute();
load();
</script>
