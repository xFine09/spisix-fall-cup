    const head='<span class="eyebrow">Árbitros</span><h2>Arbitrar</h2>';
    if(DEMO) return `<section>${head}<div class="empty">La página de arbitraje necesita el servidor.</div></section>`;
    if(!R) return `<section>${head}<div class="empty">${esc(refErr||'Cargando…')}</div></section>`;
    const order=id=>T.matches.findIndex(m=>m.id===id);
    const flows=Object.values(R.flows).sort((x,y)=>(x.step==='done')-(y.step==='done')||(x.time||9e15)-(y.time||9e15)||order(x.id)-order(y.id));
    const mine=R.lobbies.filter(l=>!l.closed), on=R.irc.status==='connected';
    const inLobby=k=>mine.some(l=>l.key===k);
    const quals=mine.filter(l=>l.kind==='qual');
    if(!UI.ref||!(R.flows[UI.ref]||quals.some(l=>l.key===UI.ref))) UI.ref=flows.find(f=>inLobby(f.id))?.id||quals[0]?.key||flows.find(f=>f.step!=='done')?.id||null;
    const item=f=>`<button type="button" class="rm ${f.step==='done'?'done':''}" data-ref="${f.id}" aria-current="${UI.ref===f.id}"><span><b>${f.id.toUpperCase()}</b> · ${esc(f.a.username)} vs ${esc(f.b.username)}</span><small>${esc(f.label.split(' · ').slice(1).join(' · '))} · ${f.score.a}–${f.score.b}${f.time?` · ${corto(f.time)} ${hora(f.time)}`:''}</small>${inLobby(f.id)?'<span class="pill live">En tu lobby</span>':f.step==='done'?'<span class="pill done">Terminado</span>':''}</button>`;
    const linked=new Set(R.slots.map(x=>String(x.mp)));
    const others=R.quals.filter(x=>!linked.has(String(x.mp))&&!mine.some(l=>String(l.mp)===String(x.mp)));
    // Solo los que necesitan árbitro ahora: con jugadores o con este árbitro, y que no sean de hace más de 6 horas. Los suyos, primero.
    const myId=S.me?.id;
    const slotRows=R.slots.filter(x=>!mine.some(l=>String(l.mp)===String(x.mp))&&(x.signed||x.pending||x.mp||x.ref_id===myId)&&x.time>T.NOW-6*3600e3).sort((x,y)=>(y.ref_id===myId)-(x.ref_id===myId)||x.time-y.time);
    const sideIn=`<h3>Partidos</h3>
        <div class="rlist">${flows.map(item).join('')||'<p class="muted" style="font-size:.85rem">Aún no hay partidos con los dos jugadores decididos: hacen falta las seeds de los clasificatorios.</p>'}</div>
        <h3>Clasificatorios</h3>
        ${quals.length?`<div class="rlist">${quals.map(l=>`<button type="button" class="rm" data-ref="${esc(l.key)}" aria-current="${UI.ref===l.key}"><span><b>${esc(l.name)}</b></span><small>MP #${esc(l.mp)} · ${l.players.length} en el lobby</small></button>`).join('')}</div>`:''}
        ${on&&slotRows.length?`<div class="mini">${slotRows.map(x=>`<div class="it"><span><b>${esc(x.name)}</b> · ${corto(x.time)} ${hora(x.time)} · ${x.signed}/${x.size}${x.pending?` · ${x.pending} sin aprobar`:''} · ${x.ref_id===myId?'<b>tuyo</b>':x.ref_name?esc(x.ref_name):'sin árbitro'}${x.mp?` · MP #${x.mp}`:''}</span><span class="qs-r">${x.mp?`<button class="btn btn-ghost btn-sm" type="button" data-act="ref-attach" data-key="qual:${x.mp}">Entrar</button><button class="btn btn-ghost btn-sm" type="button" data-act="ref-slot" data-id="${x.id}" data-replace="1">Crear otro</button>`:`<button class="btn btn-primary btn-sm" type="button" data-act="ref-slot" data-id="${x.id}">Crear lobby</button>`}</span></div>`).join('')}</div>`:''}
        ${on?`<form class="row" data-form="ref-qual"><div class="field" style="flex:1 1 140px"><label for="r-qname">Otro lobby</label><input type="text" id="r-qname" maxlength="30" placeholder="Lobby A"></div><button class="btn btn-ghost btn-sm" type="submit">Crear</button></form>`:''}
        ${on&&others.length?`<div class="mini">${others.map(x=>`<div class="it"><span>MP #${x.mp}${x.name?' · '+esc(x.name):''}</span><button class="btn btn-ghost btn-sm" type="button" data-act="ref-attach" data-key="qual:${x.mp}">Entrar</button></div>`).join('')}</div>`:''}
        ${!on&&!quals.length?'<p class="muted" style="font-size:.85rem">Conecta con Bancho para crear lobbies de clasificatorios.</p>':''}`;
    const sel=R.flows[UI.ref], ql=quals.find(l=>l.key===UI.ref);
    // Con un lobby abierto, la lista se pliega para dejar todo el ancho al chat y a la botonera.
    const wide=Boolean(ql||sel&&inLobby(sel.id));
    const side=wide?`<details class="card adm rside"><summary>Cambiar de partido o de lobby</summary>${sideIn.replace('<h3>Partidos</h3>','<h3 class="sr-only">Partidos</h3>')}</details>`:`<aside class="card adm">${sideIn}</aside>`;
    const main=sel?refMatch(sel):ql?refQual(ql):`${flashHtml()}<div class="empty">Elige un partido de la lista.</div>`;
    return `<section>${head}${refErr?`<div class="flash err">${esc(refErr)}</div>`:''}${refConn()}<div class="ref${wide?' wide':''}">${side}<div>${main}</div></div></section>`;
  },
  inicio(){
    const {cur,NOW,C}=T, reg=T.phaseBy.registros;
    const regOpen=NOW>=reg.start&&NOW<=reg.end;
    const live=T.matches.filter(m=>m.estado==='live');
    const nx=T.matches.filter(m=>m.estado==='sched'&&m.time>NOW).sort((a,b)=>a.time-b.time)[0];
    const done=T.matches.filter(m=>m.estado==='done').sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,4);
    const upcoming=T.matches.filter(m=>m.estado==='sched'&&m.time>NOW&&m!==nx).sort((a,b)=>a.time-b.time).slice(0,3);
    let target,label,eyebrow,extra='';
    if(regOpen){target=reg.end;label='para cerrar registros';eyebrow='Registros abiertos';extra=`<span class="muted num">Cierran el ${dia(reg.end)} a las ${hora(reg.end)}</span>`}
    else if(nx){target=nx.time;label='para el próximo partido';eyebrow='Próximo partido · '+nx.ronda;extra=`<div class="vs">${av(nx.a)} ${pname(nx.a)} <i>vs</i> ${pname(nx.b)} ${av(nx.b)}</div><span class="muted num">${dia(nx.time)} · ${hora(nx.time)} (hora de Madrid)</span>`}
    else{const nextP=T.phases.find(p=>p.start>NOW);if(nextP){target=nextP.start;label='para '+nextP.nombre.toLowerCase();eyebrow='Siguiente fase';extra=`<span class="muted num">${esc(nextP.nombre)} empieza el ${dia(nextP.start)}</span>`}}
    const champ=T.byId.gf.estado==='done'?T.byId.gf.winner:null;
    return `
    ${S.anuncio?`<section class="news" aria-label="Novedades"><span class="eyebrow">Novedades · ${corto(S.anuncio.at)}</span><p>${linesHtml(S.anuncio.text)}</p></section>`:''}
    ${reminders()}
    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">osu! standard · 1v1 · ${esc(C.comunidad)}</span>
        <h1>${titleHtml(C.nombre)}</h1>
        <p class="lead">${linesHtml(txt('lead',defaultLead()))}</p>
        <ul class="facts"><li class="fact">${champ?'Campeón: '+esc(champ.username):esc(cur.nombre)+(cur.estado==='now'?' en curso':' próximamente')}</li><li class="fact">${S.players.length} inscritos</li><li class="fact">${C.clasificados} plazas</li><li class="fact">ScoreV2 con NF</li></ul>
        <div class="btns">${regOpen&&!S.me?.registered?'<a class="btn btn-primary" href="#registro">Inscribirme</a>':'<a class="btn btn-primary" href="#partidos">Ver partidos</a>'}<a class="btn btn-ghost" href="#info">Formato y normas</a></div>
      </div>
      ${target?`<div class="next"><span class="eyebrow">${esc(eyebrow)}</span>
        <div class="hc-stage${UI.heroDrawn?'':' enter'}">${heroSlider()}<div class="hc"><div class="cd" id="cd" data-t="${target}" data-l="${esc(label)}">--:--:--</div></div></div>${extra}</div>`:''}
    </section>
    ${live.length?`<section><div class="sec-head"><h2>En directo</h2>${S.twitch?.channel?`<a href="https://www.twitch.tv/${encodeURIComponent(S.twitch.channel)}" target="_blank" rel="noopener">Abrir Twitch</a>`:''}</div><div class="list">${live.map(matchCard).join('')}</div></section>`:''}
    <section><div class="sec-head"><h2>Calendario</h2><span class="muted">Cada ronda tiene su showcase el día antes de empezar.</span></div>
      <div class="tl" tabindex="0" role="region" aria-label="Calendario de rondas"><ol>${T.phases.map(p=>`<li class="${p.estado}"><b>${esc(p.nombre)}</b><span>${rangoFechas(p.start,p.end)}</span>${p.sc?`<span>Showcase ${corto(p.sc)}</span>`:''}</li>`).join('')}</ol></div>
    </section>
    ${done.length||upcoming.length?`<div class="grid2">
      <section><div class="sec-head"><h2>Últimos resultados</h2><a href="#partidos">Todos</a></div><div class="list">${done.length?done.map(matchCard).join(''):'<div class="empty">Todavía no se ha jugado ningún partido.</div>'}</div></section>
      <section><div class="sec-head"><h2>Más partidos</h2></div><div class="list">${upcoming.length?upcoming.map(matchCard).join(''):'<div class="empty">No hay más partidos programados.</div>'}</div></section>
    </div>`:''}`;
  },

  info(){
    const C=T.C;
    return `
    <section><span class="eyebrow">Formato</span><h2>Cómo funciona</h2>
      ${stepsHtml(txt('formato',defaultFormato()))}
    </section>
    <section><h2>Rondas y mappools</h2>
      <div class="tbl-wrap"><table><thead><tr><th>Ronda</th><th>Showcase</th><th>Fechas</th><th class="n">SR</th><th class="n">Best of</th><th class="n">Mapas</th></tr></thead>
      <tbody>${T.phases.filter(p=>p.key!=='registros').map(p=>{const pool=S.pools[p.key]||[];return `<tr><td><b>${esc(p.nombre)}</b></td><td>${p.sc?corto(p.sc):'–'}</td><td>${rangoFechas(p.start,p.end)}</td><td class="n">${dec(p.sr)}★</td><td class="n">${p.bo?'Bo'+p.bo:'–'}</td><td class="n">${pool.length||'–'}</td></tr>`}).join('')}</tbody></table></div>
    </section>
    ${normasHtml(S.normas?.text||defaultNormas())}
    ${(()=>{const roles=['host','admin','referee','staff'].map(r=>[r==='host'?'Host':r==='admin'?'Admins':r==='referee'?'Árbitros':'Staff',(S.team||[]).filter(x=>x.role===r).map(x=>pname({id:x.id,username:x.username||''}))]).filter(([,ps])=>ps.length);
      const all=[...roles,...(C.staff||[]).map(([rol,ps])=>[rol,ps.map(esc)])];
      return all.length?`<section><h2>Equipo</h2><div class="steps">${all.map(([rol,ps])=>`<div class="step"><span class="eyebrow">${esc(rol)}</span><b>${ps.join(', ')}</b></div>`).join('')}</div></section>`:''})()}`;
  },

  jugadores(){
    const {qual,C}=T;
    if(UI.ficha!=null&&T.players.has(UI.ficha)) return fichaHtml(T.players.get(UI.ficha));
    const head=`<section><div class="sec-head"><div><span class="eyebrow">${S.players.length} inscritos · ${C.clasificados} plazas</span><h2>Jugadores</h2></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-jug="lista" aria-selected="${UI.jug==='lista'}">Inscritos</button><button class="tab" role="tab" data-jug="clasif" aria-selected="${UI.jug==='clasif'}">Clasificatorios</button></div></div>`;
    if(UI.jug==='clasif'){
      if(!qualOut()&&!S.me?.referee) return head+`<div class="empty">${S.qual.results!=null?`Los resultados de los clasificatorios se publican ${qualWhen()}.<p class="num" id="cd" data-t="${S.qual.results}" data-l=" para la publicación" style="margin:8px 0 0;font-weight:700"></p>`:'Los resultados de los clasificatorios se publicarán cuando la organización lo anuncie.'}</div></section>`;
      const hiddenNote=qualOut()?'':`<p class="note">Solo los admins y los árbitros ven estos resultados. ${S.qual.results!=null?`Se publican ${qualWhen()}.`:'Todavía no hay fecha de publicación.'}${S.me?.admin?' Se cambia en Admin → Resultados de clasificatorios.':''}</p>`;
      if(!qual.rows.length) return head+`<div class="empty">Los clasificatorios se juegan del ${corto(T.phaseBy.qualifiers.start)} al ${corto(T.phaseBy.qualifiers.end)}. Los resultados aparecen aquí en cuanto se sincroniza cada lobby.</div>${hiddenNote}</section>`;
      const zs=C.metodoClasif!=='suma';
      return head+hiddenNote+`<p class="muted">${zs?`Orden por Z-sum: en cada mapa se mide cuántas desviaciones típicas se aleja tu score de la media, y se suman los ${qual.pool.length} mapas.`:'Orden por la suma de scores de todos los mapas.'} ${T.seedsFinal?'La línea discontinua marca el corte.':'Clasificación provisional.'}</p>
      <div class="tbl-wrap"><table><thead><tr><th class="n">Seed</th><th>Jugador</th><th class="n">Rango</th><th class="n">${zs?'Z-sum':'Total'}</th>${qual.pool.map(m=>`<th class="n">${esc(m.slot)}</th>`).join('')}</tr></thead><tbody>
      ${qual.rows.map(r=>`<tr class="${r.seed===C.clasificados?'cut':''}"><td class="n">${r.seed}</td><td><span class="who2">${av(r.player)}${fname(r.player)}</span></td><td class="n">#${nf.format(r.player.rank||0)}</td><td class="n"><b>${zs?dec(r.z,2):nf.format(r.total)}</b></td>${r.scores.map(s=>`<td class="n">${s?nf.format(s):'–'}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div></section>`;
    }
    const q=UI.q.trim().toLowerCase();
    const list=[...T.players.values()].filter(p=>!q||p.username.toLowerCase().includes(q)).sort((a,b)=>(a.qseed||999)-(b.qseed||999)||a.rank-b.rank);
    const cls={reg:'',in:'acc',lower:'low',out:'',champ:'acc'};
    return head+(UI.ficha!=null?'<p class="note">Ese enlace no corresponde a ningún inscrito.</p>':'')+`<div class="tools"><label class="eyebrow" for="q">Buscar</label><input type="search" id="q" placeholder="Nombre de usuario" value="${esc(UI.q)}"></div>
      ${S.players.length?`<div class="pgrid">${list.map(p=>{const s=T.status.get(p.id);return `<div class="pc">${av(p,'lg')}<b>${fname(p,'pl-card')}</b><span class="sub">#${nf.format(p.rank||0)}${p.country?' · '+esc(p.country):''}</span><span class="sub" style="grid-column:2">Inscrito el ${corto(p.registered_at)}</span><span class="pill ${cls[s.k]}">${esc(s.txt)}</span></div>`}).join('')||'<div class="empty">Nadie coincide con la búsqueda.</div>'}</div>`:'<div class="empty">Todavía no hay nadie inscrito.</div>'}</section>`;
  },

  mappool(){
    const ps=T.phases.filter(p=>p.key!=='registros');
    if(!UI.pool||!ps.some(p=>p.key===UI.pool)){const withPool=ps.filter(p=>S.pools[p.key]?.length);UI.pool=(withPool[withPool.length-1]||ps[0]).key}
    const p=T.phaseBy[UI.pool], maps=(S.pools[p.key]||[]).slice().sort(sortSlots);
    const mm=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    const covers=maps.some(m=>m.data.cover)&&!DEMO;
    // Publicación: hora programada en el panel o, si no hay, el día del showcase. Antes solo la ve la organización.
    const rel=S.releases?.[p.key], hidden=Boolean(rel&&rel.at>T.NOW);
    const when=rel?.set?`el ${dia(rel.at)} a las ${hora(rel.at)} (hora de Madrid)`:p.sc?`en el showcase del ${dia(p.sc)}`:'';
    const waitTxt=hidden&&rel.set?`<div class="empty">La mappool de ${esc(p.nombre)} se publica ${when}.<p class="num" id="cd" data-t="${rel.at}" data-l=" para la publicación" style="margin:8px 0 0;font-weight:700"></p></div>`
      :`<div class="empty">Esta mappool se publica en el showcase${p.sc?' del '+dia(p.sc):''}.</div>`;
    return `<section><div class="sec-head"><div><span class="eyebrow">${dec(p.sr)}★ · ${p.bo?'Bo'+p.bo:'Run única'}${p.sc?' · Showcase '+corto(p.sc):''}</span><h2>Mappool · ${esc(p.nombre)}</h2></div></div>
      <div class="tabs" role="tablist">${ps.map(x=>`<button class="tab" role="tab" data-pool="${x.key}" aria-selected="${x.key===p.key}">${esc(x.nombre)}</button>`).join('')}</div>
      ${hidden&&maps.length?`<p class="note">Solo los admins y el staff ven esta mappool. Se publica ${when}.${S.me?.admin?' Se cambia en Admin → Publicación de mappools.':''}</p>`:''}
      ${maps.length?`<div class="maps ${covers?'':'nocover'}">${maps.map(({slot,beatmap_id,data:d})=>{const mod=slot.slice(0,2);const name=`${esc(d.artist)} – ${esc(d.title)}`;return `<div class="map"><span class="slot ${mod}">${esc(slot)}</span><span class="cover" ${d.cover&&covers?`style="background-image:url('${esc(d.cover)}')"`:''}></span><div class="t">${d.url&&!DEMO?`<a href="${esc(d.url)}" target="_blank" rel="noopener">${name}</a>`:`<b>${name}</b>`}<span>[${esc(d.version)}] · mapeado por ${esc(d.creator)}</span></div><div class="st"><span><b>${dec(d.sr,2)}</b>★</span><span><b>${d.bpm}</b> BPM</span><span><b>${mm(d.length)}</b></span><span>CS ${dec(d.cs)}</span><span>AR ${dec(d.ar)}</span><span>OD ${dec(d.od)}</span></div><div class="ma"><button type="button" class="ma-id" data-act="copy-id" data-id="${beatmap_id}" title="Copiar el ID para pegarlo en osu!" aria-label="Copiar el ID ${beatmap_id} de ${esc(slot)}"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10.5h-.5A1.5 1.5 0 0 1 1.5 9V3A1.5 1.5 0 0 1 3 1.5h6A1.5 1.5 0 0 1 10.5 3v.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>${beatmap_id}</span></button><a class="ma-direct" href="osu://b/${beatmap_id}" title="Abre el mapa en osu! (con osu!supporter se descarga directamente)">osu!direct</a></div></div>`}).join('')}</div>
      <p class="muted" style="font-size:.85rem">BPM, duración, CS, AR y OD ya incluyen el efecto de HR y DT.${p.key==='qualifiers'?' En clasificatorios se juegan en este orden.':''}</p>`
      :waitTxt}</section>`;
  },

  partidos(){
    const ps=T.phases.filter(p=>T.matches.some(m=>m.fase===p.key));
    if(!UI.fase||!ps.some(p=>p.key===UI.fase)){const c=ps.find(p=>p.estado==='now')||ps.find(p=>p.estado==='future')||ps[ps.length-1];UI.fase=c.key}
    // Selector de jugador: todos los inscritos, también antes de que haya cruces (la ficha del jugador enlaza aquí).
    const pj=UI.pj!=null?T.players.get(UI.pj)||null:null;
    const opts=[...T.players.values()].sort((a,b)=>a.username.localeCompare(b.username,'es',{sensitivity:'base'}));
    const picker=opts.length?`<div class="tools pj-tools"><label class="eyebrow" for="pj">Jugador</label><select id="pj"><option value="">Todos los partidos</option>${opts.map(x=>`<option value="${x.id}"${pj&&x.id===pj.id?' selected':''}>${esc(x.username)}</option>`).join('')}</select></div>`:'';
    if(pj) return playerMatches(pj,picker);
    const p=T.phaseBy[UI.fase];
    const list=T.matches.filter(m=>m.fase===UI.fase).sort((a,b)=>(a.time||9e15)-(b.time||9e15));
    return `<section><div class="sec-head"><div><span class="eyebrow">${rangoFechas(p.start,p.end)} · ${list.length} partidos · Bo${p.bo}</span><h2>Partidos</h2></div>
      <span class="muted" style="font-size:.85rem"><span class="slot wa">A</span> mapa del jugador de la izquierda · <span class="slot wb">B</span> del de la derecha</span></div>
      ${picker}${UI.pj!=null?'<p class="note">Ese enlace no corresponde a ningún inscrito. Se muestran todos los partidos.</p>':''}
      <div class="tabs" role="tablist">${ps.map(x=>`<button class="tab" role="tab" data-fase="${x.key}" aria-selected="${x.key===p.key}">${esc(x.nombre)}</button>`).join('')}</div>
      ${T.seedsFinal?'':T.NOW>T.phaseBy.qualifiers.end&&!qualOut()?`<p class="note">Los cruces se completan cuando se publiquen los resultados de los clasificatorios${S.qual.results!=null?' ('+corto(S.qual.results)+')':''}.</p>`:`<p class="note">Los cruces se completan cuando terminen los clasificatorios (${corto(T.phaseBy.qualifiers.end)}).</p>`}
      <div class="list">${list.map(matchCard).join('')}</div></section>`;
  },

  cuadro(){
    const col=(title,ms,lower)=>`<div class="bcol ${lower?'lowerb':''}"><h4>${title}</h4><div class="stack">${ms.map(bracketCard).join('')}</div></div>`;
    const W=[0,1,2,3].map(i=>T.matches.filter(m=>m.lado==='W'&&m.col===i));
    const L=[0,1,2,3,4,5].map(i=>T.matches.filter(m=>m.lado==='L'&&m.col===i));
    return `<section><div class="sec-head"><div><span class="eyebrow">Doble eliminación · ${T.C.clasificados} jugadores</span><h2>Cuadro</h2></div><span class="muted">El número es la seed de clasificatorios.</span></div>
      <h3><span class="pill acc">Upper bracket</span></h3>
      <div class="bracket" tabindex="0" role="region" aria-label="Upper bracket"><div class="bcols">${['Octavos','Cuartos','Semifinal','Final upper'].map((l,i)=>col(l,W[i])).join('')}${col('Grand Final',[T.byId.gf])}</div></div>
      <h3><span class="pill low">Lower bracket</span></h3>
      <div class="bracket" tabindex="0" role="region" aria-label="Lower bracket"><div class="bcols">${['Ronda 1','Ronda 2','Ronda 3','Ronda 4','Semifinal','Final lower'].map((l,i)=>col(l,L[i],true)).join('')}</div></div>
    </section>`;
  },

  // Estadísticas de cada ronda: #stats/<ronda>?view=resultados-individuales | leaderboard-por-mapa.
  stats(){
    const rounds=T.phases.filter(p=>p.key!=='registros');
    const sr=statsRoute(location.hash);
    const p=rounds.find(x=>x.key===sr.round)||rounds.find(x=>x.key===statsDefault(rounds));
    const view=sr.view, href=(r,v)=>`#stats/${encodeURIComponent(r)}?view=${v}`;
    // La dirección siempre completa (ronda y vista), para poder copiarla y compartirla.
    if(location.hash!==href(p.key,view)) try{history.replaceState(null,'',href(p.key,view))}catch(_){}
    const c=statsData(p.key,view), d=c?.data;
    STATS_SHOWN=p.key+'|'+view;
    let body;
    if(DEMO) body='<div class="empty">Las estadísticas las calcula el servidor del torneo: en esta vista de ejemplo no hay.</div>';
    else if(!d) body=c?.err?`<div class="empty" role="alert">${esc(c.err)}</div>`:'<div class="empty" role="status">Cargando estadísticas…</div>';
    else if(d.status==='hidden') body=`<div class="empty">Aún no hay resultados: la mappool de ${esc(p.nombre)} todavía no se ha publicado.</div>`;
    else if(d.status==='hidden-results') body=`<div class="empty">Aún no hay resultados: los de los clasificatorios se publican ${S.qual.results!=null?qualWhen():'cuando lo anuncie la organización'}.</div>`;
    else if(d.status!=='ok') body=`<div class="empty">Aún no hay resultados de ${esc(p.nombre)}.</div>`;
    else body=view==='leaderboard-por-mapa'?statsLeaderboard(d,p):statsIndividual(d,p);
    return `<section class="st-page"><div class="sec-head"><div><span class="eyebrow">Estadísticas · ${p.bo?'Bo'+p.bo:'Run única'}${p.sr?' · '+dec(p.sr)+'★':''}</span><h2>${esc(p.nombre)}</h2></div></div>
      <nav class="tabs" aria-label="Rondas">${rounds.map(x=>`<a class="tab" id="st-r-${esc(x.key)}" href="${href(x.key,view)}"${x.key===p.key?' aria-current="page"':''}>${esc(x.nombre)}</a>`).join('')}</nav>
      <div class="st-views" role="group" aria-labelledby="st-vl"><span id="st-vl" class="eyebrow">Vista:</span>${Object.entries(STATS_VIEWS).map(([k,l])=>`<a class="st-view" id="st-v-${k}" href="${href(p.key,k)}"${k===view?' aria-current="true"':''}>${l}</a>`).join('')}</div>
      ${d&&c?.err?`<p class="note">${esc(c.err)} Se muestran los últimos datos cargados.</p>`:''}
      ${body}</section>`;
  },

  registro(){
    const reg=T.phaseBy.registros, NOW=T.NOW, me=S.me, open=NOW>=reg.start&&NOW<=reg.end, url=T.C.formulario;
    const head=`<section><span class="eyebrow">${rangoFechas(reg.start,reg.end)}</span><h2>Registro</h2>${flashHtml()}`;
    const loginErr=new URLSearchParams(location.search).get('login');
    const errNote=loginErr?`<p class="flash err">${loginErr==='cancelado'?'Has cancelado el inicio de sesión en osu!.':'El inicio de sesión ha caducado. Vuelve a intentarlo.'}</p>`:'';
    const form=!open?`<p class="note">Los registros están cerrados${NOW<reg.start?`; abren el ${dia(reg.start)}`:''}.</p>`
      :/^https:\/\//.test(url||'')?`<p><a class="btn btn-primary" href="${esc(url)}" target="_blank" rel="noopener">Ir al formulario</a></p>`
      :'<p class="note">Pide el enlace al formulario a la organización.</p>';
    if(!me) return head+errNote+`<div class="card prose"><p>${linesHtml(txt('registro',DEFAULT_REGISTRO))}</p>${form}
      <p>¿Ya estás inscrito? Inicia sesión con osu! para apuntarte a un lobby de clasificatorios.</p>${S.configured?'<p><a class="btn btn-ghost" href="/auth/osu">Iniciar sesión con osu!</a></p>':''}</div></section>`;
    const profile=`<div class="profile">${av(me,'xl')}<div class="meta"><b style="font-size:1.15rem">${esc(me.username)}</b><span class="muted num">${me.rank?'Rango #'+nf.format(me.rank):'Sin rango'}${me.country?' · '+esc(me.country):''}</span></div></div>`;
    if(me.registered) return head+`<div class="card prose">${profile}<p class="flash ok">Estás inscrito${me.availability?' · Disponibilidad: '+esc(me.availability):''}.</p>
      <p><a class="btn btn-primary" href="#qualis">Apuntarme a un lobby de clasificatorios</a></p>
      <p class="muted" style="font-size:.85rem">Para retirarte, habla con la organización.</p></div></section>`;
    return head+`<div class="card prose">${profile}<p>Todavía no apareces como inscrito. Si ya has rellenado el formulario, la organización te añadirá en cuanto importe las respuestas.</p>${form}</div></section>`;
  },

  qualis(){
    const fase=T.phaseBy.qualifiers, NOW=T.NOW, me=S.me, all=S.qual.slots||[], names=new Map(S.players.map(p=>[p.id,p]));
    const mine=me?all.find(x=>x.players.includes(me.id)):null, minePending=Boolean(mine?.pending.includes(me.id)), mineStarted=mine&&!minePending&&NOW>=mine.time;
    // Los que ya han pasado sin nadie no le sirven a nadie.
    const slots=all.filter(x=>NOW<x.time||x.players.length||x.mp);
    const head=`<section><span class="eyebrow">${rangoFechas(fase.start,fase.end)}</span><h2>Lobbies de clasificatorios</h2>${flashHtml()}
      <p class="muted">${linesHtml(txt('qualis',DEFAULT_QUALIS))}</p>`;
    const notice=!me?`<p class="note">Inicia sesión con osu! para apuntarte.${S.configured?' <a href="/auth/osu">Iniciar sesión</a>':''}</p>`
      :!me.registered&&me.referee?'<p class="muted">Pulsa Arbitrar en los lobbies que vayas a llevar.</p>'
      :!me.registered?'<p class="note">Solo pueden apuntarse los inscritos. Si ya has rellenado el formulario, la organización te añadirá en cuanto importe las respuestas.</p>'
      :minePending&&NOW>=mine.time?`<p class="note bad">${esc(mine.name)} ya ha empezado y tu plaza no llegó a aprobarse. Apúntate a otro lobby.</p>`
      :minePending?`<p class="note">Has pedido plaza en <b>${esc(mine.name)}</b>, el ${dia(mine.time)} a las ${hora(mine.time)}. Falta que un árbitro o admin la apruebe.</p>`
      :mine?`<p class="flash ok">Estás en <b>${esc(mine.name)}</b>, el ${dia(mine.time)} a las ${hora(mine.time)}.</p>`
      :slots.length?'<p class="note">Todavía no estás en ningún lobby.</p>':'';
    const no=me?.qualRejection;
    const refused=no?`<p class="note bad">Han rechazado tu plaza en ${esc(no.lobby)}, el ${dia(no.time)} a las ${hora(no.time)}.${no.reason?` Motivo: ${esc(no.reason)}.`:''} Puedes apuntarte a otro lobby.</p>`:'';
    const extra=extraBlock(mineStarted), asks=refused+seatRequests()+extraRequests();
    if(!slots.length) return head+notice+asks+`<div class="empty">${all.length?'Ya no quedan lobbies disponibles: todos han empezado.':'La organización todavía no ha abierto los lobbies.'}</div>`+extra+'</section>';
    // Todos a la vista, por días: primero los que se están jugando, luego los que aún se pueden elegir y al final los que ya han empezado o terminado.
    const byDay=(list,title=d=>d)=>[...new Set(list.map(x=>dayOf(x.time)))].map(d=>{
      const rows=list.filter(x=>dayOf(x.time)===d);
      return `<div class="qd"><h3>${esc(title(dia(rows[0].time)))}</h3><div class="qr-list card">${rows.map(row).join('')}</div></div>`;
    }).join('');
    const row=x=>{
      const started=NOW>=x.time, isMine=mine?.id===x.id, full=x.players.length>=x.size, isRef=me&&x.ref_id===me.id;
      const play=!me?.registered||started||isRef||(mineStarted&&!isMine)?'':isMine
        ?'<button class="btn btn-ghost btn-sm" type="button" data-act="qs-leave">Salir</button>'
        :full?'':`<button class="btn ${mine?'btn-ghost':'btn-primary'} btn-sm" type="button" data-act="qs-join" data-id="${x.id}">${mine?'Cambiarme':'Apuntarme'}</button>`;
      const ref=!me?.referee||started||isMine?'':isRef
        ?`<button class="btn btn-ghost btn-sm" type="button" data-act="qs-claim" data-id="${x.id}" data-on="0">Dejar de arbitrar</button>`
        :x.ref_id?'':`<button class="btn btn-ghost btn-sm" type="button" data-act="qs-claim" data-id="${x.id}" data-on="1">Arbitrar</button>`;
      return `<div class="qr ${isMine?'mine':''}"><div class="qr-id"><b>${esc(x.name)}</b><span class="muted num">${hora(x.time)}</span></div>
        <div class="qs-p">${x.players.map(id=>{const p=names.get(id),wait=x.pending.includes(id);return p?`<span class="qs-n ${id===me?.id?'me':''} ${wait?'pend':''}">${av(p)}${pname(p)}${wait?' <small>pendiente</small>':''}</span>`:''}).join('')||`<span class="muted" style="font-size:.85rem">${started?'Sin jugadores':'Libre'}</span>`}</div>
        <div class="qr-m muted"><span class="num">${x.players.length}/${x.size}</span> · ${x.ref_name?'Árbitro: '+esc(x.ref_name):'Sin árbitro'}${x.mp?` · <a href="${mpUrl(x.mp)}" target="_blank" rel="noopener">MP</a>`:''}</div>
        <div class="qs-r">${started||x.manual?SLOT_PILL[x.state]||SLOT_PILL.started:full&&!isMine?'<span class="pill">Lleno</span>':''}${x.manual&&me?.referee?'<span class="muted" style="font-size:.78rem">puesto a mano</span>':''}${play}${ref}${me?.referee?`<button class="btn btn-ghost btn-sm" type="button" data-act="qs-fix" data-id="${x.id}" aria-expanded="${UI.slotFix===x.id}">${UI.slotFix===x.id?'Cerrar':'Corregir'}</button>`:''}</div>
        ${me?.referee&&UI.slotFix===x.id?slotFix(x,names):''}</div>`;
    };
    const go=extra?'<div><button class="btn btn-ghost btn-sm" type="button" data-act="qx-go">¿No te viene bien ninguna hora?</button></div>':'';
    const st=x=>x.manual?x.state:NOW<x.time?'open':x.state||'started';
    return head+notice+asks+go+byDay(slots.filter(x=>st(x)==='live'),d=>'Jugándose ahora · '+d)+byDay(slots.filter(x=>st(x)==='open'))
      +byDay(slots.filter(x=>st(x)==='started'),d=>'Ya empezados · '+d)+byDay(slots.filter(x=>st(x)==='done'),d=>'Terminados · '+d)+extra+'</section>';
  },

const RULES_DEF={bans:2,protects:1,banEvery:4,pickTimer:90,readyTimer:30,absentLimit:15,reinviteEvery:60,maxWarnings:3};
const rulesOf=k=>({...RULES_DEF,...S.rules?.[k]});
function banLines(){
  const rs=T.phases.filter(p=>p.bo).map(p=>({p,r:rulesOf(p.key)})), every=[...new Set(rs.map(x=>x.r.banEvery))];
  return [`- Los bans van por tandas, uno cada jugador en cada tanda: la primera al empezar y otra cada ${every.length===1?every[0]+' mapas jugados':'pocos mapas (según la ronda)'}, hasta completar los bans de la ronda.`,
    `- Bans y protects de cada jugador: ${rs.map(x=>`${x.p.nombre}, ${x.r.bans} ${x.r.bans===1?'ban':'bans'} y ${x.r.protects} protect${x.r.protects===1?'':'s'}${every.length>1?` (tanda cada ${x.r.banEvery} mapas)`:''}`).join(' · ')}.`];
}

function inlineText(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/https?:\/\/(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<])+/g,u=>{const end=u.match(/[.,;:)]+$/)?.[0]||'',h=u.slice(0,u.length-end.length);return `<a href="${h}" target="_blank" rel="noopener">${h}</a>${end}`});
}
function parseSections(text){
  const secs=[];let cur=null,list=null;
  const open=title=>{cur={title,body:[]};list=null;secs.push(cur)};
  for(const raw of text.split('\n')){
    const l=raw.trim();
    if(!l){list=null;continue}
    if(l.startsWith('## ')){open(l.slice(3).trim());continue}
    if(!cur) open('');
    if(/^[-•*] /.test(l)){if(!list){list=[];cur.body.push(list)}list.push(l.slice(2).trim())}
    else{list=null;cur.body.push(l)}
  }
  return secs;
}

async function poolImport(){

function keepRender(){
  const ae=document.activeElement, fid=ae&&app.contains(ae)?ae.id:null;
  let sel=null; try{if(fid&&ae.selectionStart!=null) sel=[ae.selectionStart,ae.selectionEnd]}catch(_){}
  const vals={}; app.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{if(e.dataset.keep!=='no') vals[e.id]=e.type==='checkbox'?e.checked:e.value});
  const logs=[...app.querySelectorAll('.rlog[id]')].map(e=>({id:e.id,end:e.scrollHeight-e.scrollTop-e.clientHeight<30,top:e.scrollTop}));
  const y=scrollY;
  render();
  for(const [id,v] of Object.entries(vals)){const e=document.getElementById(id);if(!e) continue;if(e.type==='checkbox') e.checked=v;else if(e.tagName!=='SELECT'||[...e.options].some(o=>o.value===v)) e.value=v}
  logs.forEach(l=>{const e=document.getElementById(l.id);if(e) e.scrollTop=l.end?e.scrollHeight:l.top});
  if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});if(sel) try{e.setSelectionRange(...sel)}catch(_){}}}
  scrollTo(0,y);
}

}

// Bot de arbitraje del partido: modo AUTO/SEMI, fase y paso, temporizadores, avisos, pasos y log.
// En SEMI (o con el bot en pausa o esperando al árbitro) cada paso es un botón con el texto exacto que se mandará.
const BOT_TIMER={pick:'Pick',ready:'Ready',absent:'Ausencia'};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const RESOLVE={
  absent:[['wait','Seguir esperando'],['','Cerrar el aviso']],
  pick:[['','Seguir esperando el pick'],['retimer','Volver a dar el tiempo']],
  warnings:[['','Seguir esperando']],
  tech:[['retry','Reintentar'],['ignore','Seguir sin comprobar']],
};
function botCard(f,l,on){
  const B=f.bot;
  if(!B) return '';
  const n=s=>esc(f[s]?.username||'');
  const auto=B.mode==='auto', idle=B.stage==='idle';
  const buttons=!auto||B.paused||B.blocked;
  const tm=Object.entries(B.timers).map(([k,t])=>`<span class="pill tbd">${BOT_TIMER[k]||esc(k)} <b class="num" ${t.left!=null?'':`data-until="${t.until}"`}>${mmss(t.left??t.until-nowMs())}</b></span>`).join('');
  const warn=B.warnings.a||B.warnings.b?`<span class="pill">Advertencias: ${n('a')} ${B.warnings.a}/${f.rules.maxWarnings} · ${n('b')} ${B.warnings.b}/${f.rules.maxWarnings}</span>`:'';
  const head=`<div class="rbot-h"><div class="rbot-st"><h3>Bot</h3><span class="pill acc">${esc(B.phase)} · ${esc(B.step)}</span>${B.paused?'<span class="pill live">Bot en pausa</span>':''}${tm}${warn}</div>
    <div class="seg" role="group" aria-label="Modo del bot"><button type="button" data-act="bot" data-do="mode" data-mode="auto" aria-pressed="${auto}" title="El bot hace cada paso solo">AUTO</button><button type="button" data-act="bot" data-do="mode" data-mode="semi" aria-pressed="${!auto}" title="Cada paso sale como botón">SEMI</button></div></div>`;
  // Avisos que esperan al árbitro: incidencias abiertas y decisiones que el bot no toma.
  const open=B.incidents.filter(i=>i.open&&i.block);
  const alerts=open.map(i=>`<div class="note bad ralert" role="alert"><b>El bot espera tu decisión</b><span>${esc(i.text)}</span><div class="row">${(RESOLVE[i.kind]||[['','Resuelta']]).map(([how,t])=>`<button class="btn btn-ghost btn-sm" type="button" data-act="bot" data-do="resolve" data-id="${i.id}" data-how="${how}">${t}</button>`).join('')}</div></div>`).join('')
    +(B.waitRef&&!open.length?`<div class="note bad" role="alert"><b>El bot espera al árbitro:</b> ${esc(B.waitRef)}</div>`:'');
  const status=B.wait||B.text?`<p class="muted" style="margin:0;font-size:.88rem">${esc(B.wait||B.text)}${B.driver&&!idle?` · Lo lleva ${esc(B.driver)}`:''}</p>`:'';
  const noIrc=!on&&!idle?'<p class="note" style="margin:0">Sin conexión a Bancho el bot no puede mandar nada: conecta y entra en el MP.</p>':'';
  const stepBtn=(a,main)=>`<button class="rstep${main?' main':''}" type="button" data-act="bot" data-do="run" data-id="${esc(a.id)}"><b>${esc(a.label)}</b>${a.out.length?`<small>${a.out.map(esc).join(' · ')}</small>`:''}</button>`;
  let steps='';
  if(B.actions.length){
    if(buttons||idle) steps=`<div class="rsteps">${B.actions.map((a,i)=>stepBtn(a,i===0)).join('')}</div>`;
    else{
      const next=B.actions.find(a=>a.auto), extra=B.actions.filter(a=>!a.auto);
      steps=`${next?`<div class="rnext">Lo siguiente que hará el bot: <b>${esc(next.label)}</b></div>`:''}${extra.length?`<div class="rsteps">${extra.map(a=>stepBtn(a,false)).join('')}</div>`:''}`;
    }

const liveClosed=id=>{try{return sessionStorage.getItem('spisix-live-closed')===id}catch(_){return false}};

function liveAction(to){

function readRoute(){
  const {v,sub,arg}=route();
  if(v==='partidos') UI.pj=sub==='jugador'&&/^\d{1,10}$/.test(arg||'')?+arg:null; // #partidos sin más quita el filtro
  if(v==='jugadores') UI.ficha=sub==='ficha'&&/^\d{1,10}$/.test(arg||'')?+arg:null; // ficha: #jugadores/ficha/<ID>
  if(!sub) return;
  if(v==='partidos'){if(sub!=='jugador') UI.fase=sub}else if(v==='mappool') UI.pool=sub;else if(v==='jugadores'&&(sub==='lista'||sub==='clasif')) UI.jug=sub;
}

// Cambiar de pestaña no cambia de vista ni mueve la página: solo se reescribe la URL.
const setSub=sub=>{try{history.replaceState(null,'',`#${currentView()}/${encodeURIComponent(sub)}`)}catch(_){}};
function currentView(){const h=route().v;if(h==='admin'&&!S.me?.admin||h==='arbitrar'&&!S.me?.referee) return 'inicio';return VIEWS[h]?h:'inicio'}

  const v=currentView(), vName=NAV.find(([k])=>k===v)?.[1];
  document.title=v==='inicio'||!vName?T.C.nombre:`${vName} · ${T.C.nombre}`;
  document.querySelector('.brand .full').textContent=T.C.nombre;
  const nav=document.getElementById('nav'), moreOpen=!!nav.querySelector('.more-btn[aria-expanded="true"]');
  nav.innerHTML=NAV.filter(([k])=>(k!=='admin'||S.me?.admin)&&(k!=='arbitrar'||S.me?.referee)).map(([k,l])=>`<a href="#${k}" ${k===v?'aria-current="page"':''}>${l}${k==='qualis'&&toReview()?` (${toReview()})`:''}</a>`).join('')
    +`<div class="more" hidden><button class="more-btn" type="button" aria-expanded="false" aria-controls="navMore"><span>Más</span><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="more-menu" id="navMore" hidden></div></div>`;
  document.getElementById('who').innerHTML=S.me?`${av(S.me)}<span class="uname">${esc(S.me.username)}</span>${DEMO?'':'<button type="button" data-act="logout">Salir</button>'}`:(S.configured?'<a class="login" href="/auth/osu">Iniciar sesión</a>':'');
  fitNav(); document.fonts?.ready.then(fitNav);
  document.documentElement.style.setProperty('--top-h',(document.querySelector('.top')?.offsetHeight||0)+'px'); // para las cabeceras fijas de las tablas de Stats
  if(moreOpen) openMore(false);
  // Un h1 por página: en Inicio, el del hero; en el resto, el nombre del torneo para los lectores de pantalla.
  app.innerHTML=(v==='inicio'?'':`<h1 class="sr-only">${esc(T.C.nombre)}</h1>`)+VIEWS[v]();
  // En el panel, el navegador no debe rellenar ni ofrecer guardar lo que se escribe (no son datos de acceso).
  if(v==='admin') app.querySelectorAll('form').forEach(f=>f.setAttribute('autocomplete','off'));
  if(v==='arbitrar') app.querySelectorAll('.rlog').forEach(e=>e.scrollTop=e.scrollHeight);

  renderLive();
  // Si una mappool se publica en la próxima hora, se recargan los datos justo entonces (salvo en vistas con formularios).
  clearTimeout(relTimer);
  const nextRel=[...Object.values(S.releases||{}),{at:S.qual.results??0}].map(r=>r.at-nowMs()).filter(d=>d>0&&d<3600e3).sort((a,b)=>a-b)[0];
  if(nextRel&&!DEMO) relTimer=setTimeout(()=>{if(!['admin','arbitrar'].includes(currentView())) load()},nextRel+1500);
  clearInterval(timer);
  const cd=document.getElementById('cd');
  if(cd){const t=+cd.dataset.t,l=cd.dataset.l;const tick=()=>{const s=Math.max(0,Math.floor((t-nowMs())/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;cd.innerHTML=`${d?d+'d ':''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}<small>${esc(l)}</small>`};tick();if(!DEMO) timer=setInterval(tick,1000)}
}

// Datos de ejemplo solo sin servidor (archivo abierto en local, hosting estático o ?demo). Si el servidor
// existe pero falla, no se inventa nada: se avisa y se reintenta, o se mantienen los últimos datos cargados.
async function load(){
  let r=null, data=null;
  try{
    r=await fetch('/api/state',{credentials:'same-origin',headers:{Accept:'application/json'}});
    if(r.ok&&(r.headers.get('content-type')||'').includes('json')) data=await r.json();
  }catch(e){}
  if(data){S=data;DEMO=false;LOADED=Date.now();return render()}
  if(DEMO) return;
  const noServer=location.protocol==='file:'||new URLSearchParams(location.search).has('demo')||!r||r.status===404;
  if(!S&&noServer){
    DEMO=true; S=demoState();
    document.getElementById('demoBar').hidden=false;
    return render();
  }
  if(!S) app.innerHTML='<div class="empty">No se ha podido conectar con el servidor. Se volverá a intentar en unos segundos.</div>';
  setTimeout(load,15e3);
}
// Cada minuto se recargan los datos (resultados en directo, nuevos inscritos), salvo en Admin y Registro
// para no borrar lo que se está escribiendo. Se conserva el desplazamiento horizontal del cuadro y las tablas.
setInterval(async()=>{
  if(!S||DEMO||document.hidden||UI.busy||['admin','arbitrar'].includes(currentView())||document.activeElement?.id==='q'||(currentView()==='qualis'&&(app.querySelector('input:focus')||[...app.querySelectorAll('#q-xn,#q-xt,[id^=qa-r],[id^=qx-r]')].some(e=>e.value)))) return;
  const sel='.bracket,.tbl-wrap', pos=[...document.querySelectorAll(sel)].map(e=>e.scrollLeft);
  const pjFocus=document.activeElement?.id==='pj'; // el selector de jugador conserva el foco (los resultados se siguen actualizando)
  await load();
  if(pjFocus) document.getElementById('pj')?.focus({preventScroll:true});
  document.querySelectorAll(sel).forEach((e,i)=>{if(pos[i]) e.scrollLeft=pos[i]});
},60e3);

async function post(path,data){
  if(DEMO) throw new Error('En la vista previa no se guarda nada.');
  const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Error '+r.status);
  return j;
}
async function act(fn,okText){
  UI.busy=true;UI.flash=null;
  try{const res=await fn();DIRTY=false;UI.flash={ok:!res?.warning,text:res?.warning||(typeof okText==='function'?okText(res):okText)};if(!DEMO) await load();else render()}
  catch(e){UI.flash={ok:false,text:e.message};render()}
  finally{UI.busy=false}
}

// Copia el ID del mapa (para pegarlo en osu!, p. ej. en !mp map). Sin HTTPS no hay API del portapapeles: se usa execCommand.
async function copyId(b){
  const id=b.dataset.id, label=b.querySelector('span');
  let ok=false;
  try{await navigator.clipboard.writeText(id);ok=true}catch(_){
    const t=document.createElement('textarea');t.value=id;t.setAttribute('readonly','');t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();
    try{ok=document.execCommand('copy')}catch(_){}
    t.remove();
  }
  clearTimeout(b._t);
  label.textContent=ok?'Copiado':'No se pudo copiar';b.classList.toggle('ok',ok);
  let live=document.getElementById('copyLive');
  if(!live){live=document.createElement('span');live.id='copyLive';live.className='sr-only';live.setAttribute('aria-live','polite');document.body.append(live)}
  live.textContent=ok?`ID ${id} copiado`:'No se pudo copiar el ID';
  b._t=setTimeout(()=>{label.textContent=id;b.classList.remove('ok')},1600);
}

  if(e.target.id==='a-mid'){UI.admMatch=e.target.value;UI.flash=null;render()}
  if(e.target.dataset.slotState) return act(()=>post('/api/ref/qual-slot/state',{id:+e.target.dataset.slotState,state:e.target.value}),e.target.value==='auto'?'El estado del lobby vuelve a ser automático.':`Lobby marcado como ${SLOT_NAME[e.target.value]}.`);

  if(e.target.dataset.roleId) return act(()=>post('/api/admin/role',{id:+e.target.dataset.roleId,role:e.target.value}),'Rol cambiado.');
  if(e.target.dataset.pv!==undefined){UI.poolRead.groups[+e.target.dataset.pv].round=e.target.value;return keepRender()}
  if(e.target.id==='a-pfile'){
    const file=e.target.files[0]; if(!file) return;
    UI.poolText=val('a-ptext');
    if(file.size>20*1024*1024){UI.flash={ok:false,text:'El archivo pesa más de 20 MB. Copia solo la pestaña de las mappools.'};return keepRender()}
    return file.arrayBuffer().then(buf=>{
      const bytes=new Uint8Array(buf);let bin='';
      for(let i=0;i<bytes.length;i+=32768) bin+=String.fromCharCode(...bytes.subarray(i,i+32768));
      return poolRead({file:btoa(bin)},file.name);
    },()=>{UI.flash={ok:false,text:'No puedo leer ese archivo. Vuelve a elegirlo.'};keepRender()});
  }
  if(e.target.id==='r-force'){UI.refForce=e.target.checked;return keepRender()}
  if(refPending&&e.target.tagName==='SELECT'){refPending=false;keepRender()}
  if(e.target.id==='a-round'||e.target.id==='a-pround') UI.admRound=e.target.value;
});

  const f=e.target;
  const kind=f.dataset.form;
  if(kind==='pool-read'){
    UI.poolText=val('a-ptext');
    if(!UI.poolText.trim()){UI.flash={ok:false,text:'Elige un archivo o pega las filas de la hoja.'};return render()}
    return poolRead({text:UI.poolText});
  }
  if(kind==='pool') UI.admRound=val('a-round');
  if(kind==='pool') return act(()=>post('/api/admin/pool',{round:val('a-round'),slot:val('a-slot'),beatmap:val('a-bm')}),'Mapa añadido con los datos de osu!.');
  if(kind==='qual') return act(()=>post('/api/admin/qual',{mp:mpId(val('a-qmp'))}),'Lobby añadido y leído desde osu!.');
  if(kind==='imp'){
    UI.impText=val('a-imp');
    const btn=f.querySelector('button'); btn.disabled=true; btn.textContent='Importando…';
    return act(async()=>{const r=await post('/api/admin/import',{text:UI.impText});UI.imp=r;UI.impText='';return r},
      r=>`Importación terminada: ${r.imported.length} inscritos nuevos.`+(r.notFound.length||r.rejected.length?' Revisa abajo los que faltan.':''));
  }
  if(kind==='exc') return act(()=>post('/api/admin/exception',{user:val('a-exc')}),'Excepción añadida: ya puede inscribirse aunque su rango esté fuera del límite.');
  if(kind==='api') return act(()=>post('/api/admin/api-access',{user:val('a-api')}),r=>`${r.username} ya puede abrir la guía de la API (${location.origin}/api.html).`);
  if(kind==='role') return act(()=>post('/api/admin/role',{user:val('a-ru'),role:val('a-rr')}),r=>`${r.username} ya es ${ROLE_TXT[r.role].toLowerCase()}.`);
  if(kind==='qs-add') return act(()=>post('/api/admin/qual-slot/assign',{id:+val('a-qal'),user:+val('a-qap')}),'Jugador añadido al lobby.');
  if(kind==='site'){
    const key=f.dataset.key, text=val('a-tx-'+key).trim();
    if(!text){UI.flash={ok:false,text:'Escribe el texto, o pulsa Volver al original.'};return keepRender()}
    UI.textReset=null;
    return act(()=>post('/api/admin/site-text',{key,text}),'Texto guardado.');
  }
  if(kind==='fases'){
    UI.fasesReset=false;
    const fases=T.phases.map(p=>{
      const g=k=>val(`a-f-${p.key}-${k}`), x={key:p.key,nombre:g('nombre'),inicio:g('inicio'),fin:g('fin')};
      if(p.showcase!=null) x.showcase=g('showcase');
      if(p.sr!=null) x.sr=+g('sr');
      if(p.bo!=null) x.bo=+g('bo');
      return x;
    });
    return act(()=>post('/api/admin/fases',{fases}),'Rondas guardadas.');
  }
  if(kind==='anuncio'){
    const text=val('a-an').trim();
    if(!text){UI.flash={ok:false,text:'Escribe el anuncio, o pulsa Quitar el anuncio.'};return keepRender()}
    return act(()=>post('/api/admin/site-text',{key:'anuncio',text}),'Anuncio publicado en Inicio.');
  }
  if(kind==='normas'){
    const text=val('a-no').trim();
    if(!text){UI.flash={ok:false,text:'Escribe las normas, o pulsa Volver a las originales.'};return keepRender()}
    UI.normasReset=false;
    return act(()=>post('/api/admin/site-text',{key:'normas',text}),'Normas guardadas.');
  }
  if(kind==='qx-ask'){
    const t=val('q-xt');
    return act(()=>post('/api/qual/request',{time:t?zoned(t,false,T.C.zona):null,note:val('q-xn')}),'Solicitud enviada.');
  }
  if(kind==='qs-grid'){
    const from=val('a-gf'), to=val('a-gt'), week=new Set([...document.querySelectorAll('.a-gw:checked')].map(x=>+x.value)), days=[];
    if(!from||!to||from>to){UI.flash={ok:false,text:'Elige bien el primer y el último día.'};return keepRender()}
    for(let d=new Date(from+'T12:00:00Z');d.toISOString().slice(0,10)<=to&&days.length<=26;d.setUTCDate(d.getUTCDate()+1)) if(week.has(d.getUTCDay())) days.push(d.toISOString().slice(0,10));
    const times=val('a-gh').split(/[\s,;]+/).filter(Boolean).map(t=>t.replace(/^(\d):/,'0$1:'));
    return act(()=>post('/api/admin/qual-slot/generate',{days,times,size:+val('a-gz')}),r=>`Creados ${r.created} lobbies en ${days.length} ${days.length===1?'día':'días'}.${r.skipped?` ${r.skipped} ya existían a esa hora y se han dejado.`:''}${r.past?` ${r.past} ya han pasado y no se han creado.`:''}${r.late?` ${r.late===1?'Uno empezaría':r.late+' empezarían'} justo cuando se fijan las seeds, y no se ${r.late===1?'ha creado':'han creado'}.`:''}`);
  }
  if(kind==='qs-save'){
    const t=val('a-st');
    if(!t){UI.flash={ok:false,text:'Elige la fecha y la hora del lobby.'};return keepRender()}
    const id=UI.slotEdit;
    return act(async()=>{const r=await post('/api/admin/qual-slot',{...(id?{id}:{}),name:val('a-sn'),time:zoned(t,false,T.C.zona),size:+val('a-sz')});UI.slotEdit=null;return r},id?'Lobby guardado.':'Lobby creado: los jugadores ya pueden apuntarse.');
  }
  // Arbitraje. La contraseña se borra del formulario antes de enviarla: si falla, hay que volver a pegarla.
  if(kind==='ref-conn'){
    const el=document.getElementById('r-pass'), pw=el.value; el.value='';
    if(!pw.trim()){UI.flash={ok:false,text:'Pega tu contraseña IRC.'};return keepRender()}
    const btn=f.querySelector('button'); btn.disabled=true; btn.textContent='Conectando…';
    return refAct('/api/ref/connect',{password:pw},'Conectado a Bancho.');
  }
  if(kind==='ref-fill'){
    const body={key:UI.ref,type:'complete',protect:val('r-c-protect'),ban:val('r-c-ban'),pick:val('r-c-pick'),protects:val('r-c-protects'),bans:val('r-c-bans'),picks:val('r-c-picks'),replace:Boolean(document.getElementById('r-c-replace')?.checked)};
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true;
    UI.fillErr=null;
    return post('/api/ref/act',body).then(()=>{UI.refFill=false;UI.flash={ok:true,text:'Partido completado: protects, bans y picks apuntados en la web. En el lobby no se ha mandado nada.'}},e=>{UI.fillErr=e.message}).finally(keepRender);
  }
  if(kind==='ref-order') return refAct('/api/ref/act',{key:UI.ref,type:'order',protect:val('r-o-protect'),ban:val('r-o-ban'),pick:val('r-o-pick')});
  const refText=(id,send)=>{const el=document.getElementById(id), t=el.value.trim(); if(!t) return; el.value=''; return send(t).then(ok=>{if(!ok){const x=document.getElementById(id);if(x&&!x.value) x.value=t}})};
  if(kind==='bot-note') return refText('r-note',t=>refAct('/api/ref/act',{key:UI.ref,type:'bot',do:'note',note:t},'Incidencia anotada en el log del bot.'));
  if(kind==='ref-chat') return refText('r-chat',t=>refAct('/api/ref/chat',{key:UI.ref,text:t}));
  if(kind==='ref-wu') return refText('r-wu',t=>refAct('/api/ref/act',{key:UI.ref,type:'warmup',beatmap:t}));
  if(kind==='ref-inv') return refText('r-inv',t=>refAct('/api/ref/act',{key:UI.ref,type:'invite',names:t}));
  if(kind==='ref-qual') return refText('r-qname',t=>refAct('/api/ref/lobby',{qual:t},r=>`Lobby creado (MP #${r.mp}). Invita a los jugadores.`,r=>{UI.ref=r.key}));
  if(kind==='match'){
    const t=val('a-time');
    return act(()=>post('/api/admin/match',{id:val('a-mid'),time:t?zoned(t,false,T.C.zona):null,ref:val('a-ref'),mp:mpId(val('a-mp'))||null,ff:val('a-ff')||null,bans:val('a-bans').split(/[,\s]+/).filter(Boolean)}),'Partido guardado.');
  }
});
document.getElementById('sim').addEventListener('change',e=>{SIM=e.target.value;S=demoState();PROF.clear();UI.fase=null;UI.pool=null;render()});
// Menú «Más»: las secciones que no caben en la cabecera pasan a un desplegable. La actual se queda fuera
// mientras quepa; si ni así cabe (móvil), el botón lleva su nombre y el desplegable muestra todas.
function fitNav(){
  const nav=document.getElementById('nav'), more=nav.querySelector('.more'), menu=document.getElementById('navMore');
  if(!more) return;
  const links=[...nav.querySelectorAll(':scope>a')], cur=links.find(a=>a.hasAttribute('aria-current'));
  const over=()=>{const r=nav.getBoundingClientRect().right;return [...nav.children].some(e=>!e.hidden&&e.getBoundingClientRect().right>r+1)};
  links.forEach(a=>a.hidden=false); more.hidden=true; more.classList.remove('solo');
  const label=more.querySelector('.more-btn span'), btn=more.querySelector('.more-btn');
  label.textContent='Más'; btn.removeAttribute('aria-label');
  if(over()){
    more.hidden=false;
    for(const a of links.filter(a=>a!==cur).reverse()){if(!over()) break;a.hidden=true}
    if(over()&&cur){
      cur.hidden=true; more.classList.add('solo');
      label.textContent=cur.textContent; btn.setAttribute('aria-label',`Secciones (ahora: ${cur.textContent})`);
    }
  }
  const hid=links.filter(a=>a.hidden);
  menu.innerHTML=hid.map(a=>`<a href="${a.getAttribute('href')}"${a===cur?' aria-current="page"':''}>${a.innerHTML}</a>`).join('');
  if(!hid.length) closeMore(false);
}
function openMore(focus){
  const b=document.querySelector('.more-btn');
  if(!b||b.closest('.more').hidden) return;
  b.setAttribute('aria-expanded','true'); document.getElementById('navMore').hidden=false;
  if(focus) document.querySelector('#navMore a')?.focus();
}
function closeMore(focus){
  const b=document.querySelector('.more-btn');
  if(!b||b.getAttribute('aria-expanded')!=='true') return;
  b.setAttribute('aria-expanded','false'); document.getElementById('navMore').hidden=true;
  if(focus) b.focus();
}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.more-btn');
  // Con teclado (detail 0) el foco pasa a la primera sección del desplegable.
  if(b) return b.getAttribute('aria-expanded')==='true'?closeMore(false):openMore(e.detail===0);
  if(e.target.closest('#navMore a')) closeMore(false);
});
// Stats: cada mapa del leaderboard se queda abierto o cerrado al recargar los datos.
app.addEventListener('toggle',e=>{
  const el=e.target; if(!el.matches?.('details.st-map')) return;
  el.open?UI.stClosed.delete(el.dataset.st):UI.stClosed.add(el.dataset.st);
  const b=document.getElementById('st-all'); if(!b) return;
  const all=[...app.querySelectorAll('details.st-map')].every(x=>x.open);
  b.dataset.open=all?'0':'1';b.textContent=all?'Cerrar todos':'Abrir todos';
},true);
document.getElementById('nav').addEventListener('focusout',e=>{if(!e.relatedTarget?.closest?.('.more')&&e.target.closest('.more')) closeMore(false)});
document.addEventListener('click',e=>{if(!e.target.closest('.more')) closeMore(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.more-btn[aria-expanded="true"]')) closeMore(true)});
let fitRaf=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitNav)});
window.addEventListener('hashchange',()=>{
  // Dentro de Stats (otra ronda u otra vista, también con atrás y adelante) no se sube ni se mueve el foco.
  const wasStats=Boolean(app.querySelector('section.st-page')), focusId=document.activeElement?.id;
  UI.flash=null;DIRTY=false;readRoute();
  if(wasStats&&currentView()==='stats'){render();if(focusId) document.getElementById(focusId)?.focus({preventScroll:true});return}
  render();window.scrollTo(0,0);
  // El foco pasa al título de la vista nueva: los lectores de pantalla la anuncian y Tab sigue desde ahí.
  const h=app.querySelector('h1:not(.sr-only),h2');
  if(h){h.tabIndex=-1;h.dataset.focusTarget='';h.focus({preventScroll:true})}
});
// Aviso al cerrar o recargar con algo escrito sin guardar en Admin o Registro.
let DIRTY=false;
app.addEventListener('input',e=>{if(['admin','registro'].includes(currentView())&&e.target.closest('form')) DIRTY=true});
window.addEventListener('beforeunload',e=>{if(DIRTY&&!DEMO){e.preventDefault();e.returnValue=''}});

// Tema: automático (el del sistema), claro u oscuro. Se recuerda en este navegador.
const THEMES=['auto','light','dark'], THEME_NAME={auto:'automático',light:'claro',dark:'oscuro'};
const THEME_ICON={
  auto:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
};
const themeBtn=document.getElementById('themeBtn');
function setTheme(t,save){
  const root=document.documentElement;
  if(t==='auto') delete root.dataset.theme; else root.dataset.theme=t;
  if(save) try{t==='auto'?localStorage.removeItem('spisix-theme'):localStorage.setItem('spisix-theme',t)}catch(_){}
  const next=THEMES[(THEMES.indexOf(t)+1)%THEMES.length];
  themeBtn.innerHTML=THEME_ICON[t];
  themeBtn.setAttribute('aria-label',`Tema ${THEME_NAME[t]}. Cambiar a ${THEME_NAME[next]}`);
  themeBtn.title=`Tema ${THEME_NAME[t]}`;
  // La barra del navegador del móvil, con el color del tema elegido
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.content=t==='auto'?(m.media.includes('dark')?'#171B28':'#FFFFFF'):t==='dark'?'#171B28':'#FFFFFF');
}
setTheme(document.documentElement.dataset.theme||'auto',false);
themeBtn.addEventListener('click',()=>{const t=document.documentElement.dataset.theme||'auto';setTheme(THEMES[(THEMES.indexOf(t)+1)%THEMES.length],true)});
readRoute();
load();
</script>
